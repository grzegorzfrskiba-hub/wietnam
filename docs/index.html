/* Layout: photo opener, the facts, the settings, the day strip, then the route as a split view: sticky to-scale map beside the stays on desktop, stacked on phones. */
:root {
  --paper: #eef2ef;
  --surface: #ffffff;
  --ink: #13221f;
  --muted: #55675f;
  --line: #d3ddd8;
  --accent: #0c6a5a;
  --accent-soft: #d8eae4;
  --warm-soft: #f4e7cc;
  --warm: #8a5a00;
  --cool-soft: #dde8f4;
  --cool: #23558a;
  --wet-soft: #f5dcd6;
  --wet: #9b3826;
  --lilac-soft: #e8e2f3;
  --on-c: #ffffff;
  --on-photo: #ffffff;
  --shade: rgba(6, 16, 14, 0.78);
  /* over photos, in the photo viewer and in shadows: the same in light and dark (rgb triplets go into rgba(var(--x), a)) */
  --photo-bg: #10201c; --scrim: 6, 16, 14; --black: 0, 0, 0; --white: 255, 255, 255;
  --ctl-bg: rgba(250, 252, 251, 0.92); --ctl-ink: #13221f; --badge-bg: rgba(10, 20, 18, 0.72); --lb-bg: rgba(6, 12, 11, 0.95); --lb-ink: #f2f5f4;
  --stop-gap: 18px; --stop-gap-compact: 10px;
  --sea: #dbe8ef; --land: #fbfaf5; --land-o: #e9ebe4; --border: #a8b4ae; --river: #8fb8cf; --water-ink: #5a7f96;
  /* the colours of the places (palette numbers in content/<id>.js, field color); 14–20 wait for new places */
  --pal-1: #4b5a66; --pal-2: #82552c; --pal-3: #12707e; --pal-4: #4a7426; --pal-5: #2d7552; --pal-6: #a1443a; --pal-7: #3f4a9e;
  --pal-8: #5c7520; --pal-9: #23676a; --pal-10: #2b5f9b; --pal-11: #9a3f6e; --pal-12: #6e4fa0; --pal-13: #946000; --pal-14: #b0305a;
  --pal-15: #5146a8; --pal-16: #2f6b3a; --pal-17: #a3500f; --pal-18: #7a3d8a; --pal-19: #1f6286; --pal-20: #646419;
  --display: "Newsreader", "Iowan Old Style", Georgia, serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --gutter: clamp(16px, 4vw, 40px);
}
/* dark colours on screen only: a printout is always dark ink on white paper */
@media screen and (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0c1513; --surface: #131f1c; --ink: #e3ece8; --muted: #9bb0a8; --line: #26342f;
    --accent: #5cc4ad; --accent-soft: #163a32; --warm-soft: #3a2e14; --warm: #e8b856; --cool-soft: #172c42; --cool: #8ab8ec;
    --wet-soft: #43211b; --wet: #f09a85; --lilac-soft: #2b2440; --on-c: #0c1513; --sea: #0b1a26; --land: #26372f; --land-o: #18231f; --border: #4a5d55; --river: #2f5a6e; --water-ink: #7fa6bd;
    --pal-1: #b2c1cc; --pal-2: #d9a874; --pal-3: #5fcad8; --pal-4: #a2d16f; --pal-5: #6fcf9d; --pal-6: #ee8f80; --pal-7: #a9b1f0;
    --pal-8: #c3d975; --pal-9: #6cc6c0; --pal-10: #86b4ee; --pal-11: #ec96c3; --pal-12: #bba0ec; --pal-13: #f0bb4f; --pal-14: #f59ab8;
    --pal-15: #b2acf2; --pal-16: #86d394; --pal-17: #f4ad6d; --pal-18: #d9a3e6; --pal-19: #7cc0e6; --pal-20: #d3d36a;
    color-scheme: dark;
  }
}
@media screen {
  :root[data-theme="dark"] {
    --paper: #0c1513; --surface: #131f1c; --ink: #e3ece8; --muted: #9bb0a8; --line: #26342f;
    --accent: #5cc4ad; --accent-soft: #163a32; --warm-soft: #3a2e14; --warm: #e8b856; --cool-soft: #172c42; --cool: #8ab8ec;
    --wet-soft: #43211b; --wet: #f09a85; --lilac-soft: #2b2440; --on-c: #0c1513; --sea: #0b1a26; --land: #26372f; --land-o: #18231f; --border: #4a5d55; --river: #2f5a6e; --water-ink: #7fa6bd;
    --pal-1: #b2c1cc; --pal-2: #d9a874; --pal-3: #5fcad8; --pal-4: #a2d16f; --pal-5: #6fcf9d; --pal-6: #ee8f80; --pal-7: #a9b1f0;
    --pal-8: #c3d975; --pal-9: #6cc6c0; --pal-10: #86b4ee; --pal-11: #ec96c3; --pal-12: #bba0ec; --pal-13: #f0bb4f; --pal-14: #f59ab8;
    --pal-15: #b2acf2; --pal-16: #86d394; --pal-17: #f4ad6d; --pal-18: #d9a3e6; --pal-19: #7cc0e6; --pal-20: #d3d36a;
    color-scheme: dark;
  }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.6; }
body.lb-open { overflow: hidden; }
img { display: block; max-width: 100%; height: auto; }
a { color: var(--accent); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
h1, h2, h3 { font-family: var(--display); font-weight: 500; line-height: 1.1; }
p, ul, ol { margin: 0; }
ul, ol { padding: 0; list-style: none; }
.wrap { max-width: 1200px; margin: 0 auto; padding-inline: var(--gutter); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
.btn { font: 500 15px var(--body); color: var(--surface); background: var(--accent); border: 0; border-radius: 6px; padding: 11px 18px; cursor: pointer; min-height: 44px; }
.btn:hover { filter: brightness(1.08); }

/* Hero */
.hero { position: relative; min-height: clamp(460px, 64vh, 680px); display: flex; align-items: flex-end; overflow: hidden; background: var(--photo-bg); }
/* without JavaScript (an iPhone's preview of the offline file): where to open the page instead */
.noscript { margin: 0; padding: 16px var(--gutter); background: var(--warm-soft); color: var(--ink); }
.hero > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 55%; }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(var(--scrim), 0.45) 0%, rgba(var(--scrim), 0.12) 28%, rgba(var(--scrim), 0.2) 50%, var(--shade) 100%); }
.hero-text { position: relative; z-index: 1; width: 100%; padding-block: 48px clamp(32px, 6vh, 56px); color: var(--on-photo); text-shadow: 0 1px 14px rgba(var(--black), 0.35); }
.hero .eyebrow { color: var(--on-photo); opacity: 0.85; }
.hero h1 { font-size: clamp(42px, 7.4vw, 92px); font-weight: 400; letter-spacing: -0.02em; margin-top: 10px; max-width: 16ch; }
.hero h1 em { font-style: italic; }
.hero-lede { margin-top: 14px; max-width: 54ch; font-size: clamp(16px, 1.5vw, 19px); opacity: 0.94; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
.hero-cta a { font: 500 15px var(--body); text-decoration: none; padding: 11px 18px; border-radius: 6px; min-height: 44px; display: inline-flex; align-items: center; }
.hero-cta .primary { background: var(--on-photo); color: var(--photo-bg); }
.hero-cta .ghost { color: var(--on-photo); border: 1px solid rgba(var(--white), 0.6); }
.hero-where { position: absolute; z-index: 1; right: var(--gutter); bottom: 12px; font: 12px var(--mono); color: var(--on-photo); opacity: 0.85; }

/* Facts: the trip in figures, right under the settings */
.facts { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding-inline: clamp(16px, 2.4vw, 26px); margin-bottom: clamp(28px, 4vw, 40px); }
.facts ul { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)) minmax(0, 1.9fr); }
.facts li { padding: 18px 0; display: grid; gap: 2px; min-width: 0; }
.facts li + li { border-left: 1px solid var(--line); padding-left: 18px; }
.facts b { font-family: var(--display); font-weight: 500; font-size: clamp(26px, 3vw, 36px); line-height: 1; white-space: nowrap; }
.facts span { font-size: 13px; color: var(--muted); }
.facts b small { font-size: 0.6em; }   /* the unit of the longest day */
.facts-for { padding-top: 14px; font: 500 11px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }

/* Blocks */
.block { padding-block: clamp(48px, 7vw, 84px) 0; }
.block-head { display: grid; gap: 10px; margin-bottom: 26px; max-width: 66ch; }
.block-head h2 { font-size: clamp(30px, 3.8vw, 44px); }
.block-head p { color: var(--muted); }
.h-sub { font-family: var(--display); font-size: 26px; font-weight: 500; }

/* Tones & pace */
.pace { display: inline-block; vertical-align: 2px; font: 500 11px var(--mono); letter-spacing: 0.04em; padding: 2px 7px; border-radius: 4px; margin-left: 4px; white-space: nowrap; background: var(--paper); color: var(--muted); border: 1px solid var(--line); }
.pace-hike { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.pace-boat { background: var(--cool-soft); color: var(--cool); border-color: transparent; }
.pace-culture { background: var(--warm-soft); color: var(--warm); border-color: transparent; }
.pace-rest { background: var(--lilac-soft); color: var(--ink); border-color: transparent; }
.pace-easy { background: transparent; color: var(--accent); border: 1px dashed var(--accent); }
.pace-hard { background: transparent; color: var(--wet); border: 1px dashed var(--wet); }
.pace-early { background: transparent; color: var(--warm); border: 1px dashed var(--warm); }

/* Settings: compact, so on a phone the form starts on the first screen and the figures of the trip follow it */
.settings { display: grid; gap: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: clamp(16px, 2.4vw, 26px); }
.set-group { border: 0; margin: 0; padding: 0; min-width: 0; display: grid; gap: 10px; align-content: start; }
.set-group legend { font-weight: 600; font-size: 17px; padding: 0; margin-bottom: 8px; }
.set-row { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; }
/* two fields in one row (month and days, the two dates, the two airports), each as wide as the row allows */
.set-pair { display: flex; gap: 10px; align-items: flex-end; max-width: 560px; }
.field-grow { flex: 1 1 0; min-width: 0; }
.set-arrow { padding-bottom: 10px; color: var(--muted); }
.field { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
/* min-width 0: a date field's own minimum would push two of them past a 360 px phone (tests/probes/settings.js) */
.field select, .field input { width: 100%; min-width: 0; font: 16px var(--body); color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; min-height: 44px; }
/* a choice of one as buttons in a row: the term mode and the level */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 3px; padding: 3px; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; max-width: 560px; }
.seg label { position: relative; display: grid; place-items: center; min-height: 44px; padding: 4px 6px; border-radius: 6px; cursor: pointer; font-size: 15px; text-align: center; line-height: 1.25; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked) { background: var(--surface); box-shadow: 0 0 0 2px var(--accent); font-weight: 600; }
.seg label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
/* on a wide screen the four groups of the form stand in two columns */
@media (min-width: 900px) { .settings { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 40px; } }
.chip { position: relative; display: inline-flex; align-items: center; gap: 8px; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; min-height: 44px; cursor: pointer; font-size: 15px; }
.chip input { position: absolute; opacity: 0; pointer-events: none; }
.chip:has(input:checked) { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); background: var(--accent-soft); }
.chip:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 3px; }
.chip:has(input:disabled) { opacity: 0.45; cursor: default; }
.set-note { font-size: 13px; color: var(--muted); }
.set-msg { font-size: 14.5px; color: var(--wet); }
.set-msg:not(:empty) { margin-top: 14px; }
/* Holiday warnings under the facts, and the places that did not fit */
.alerts { display: grid; gap: 6px; padding-bottom: 14px; }
.alerts li { font-size: 14px; background: var(--warm-soft); border-left: 3px solid var(--warm); padding: 8px 12px; border-radius: 4px; }
/* the warnings sit inside .facts, whose rules for the row of figures (columns, a line between figures) are stronger than the two above */
.facts ul.alerts { grid-template-columns: minmax(0, 1fr); }
.facts ul.alerts li { border-left: 3px solid var(--warm); padding: 8px 12px; }
/* the status lines stay in the page when empty (a screen reader may skip the first message of a region that appears) */
.missing { font-size: 15px; color: var(--wet); }
.missing:not(:empty) { margin-top: 16px; }
.dropped { font-size: 15px; color: var(--ink); }
.dropped:not(:empty) { margin-top: 16px; }
footer .ft-copy { margin-top: 18px; }

/* The either-or choice in a card (SWAPS): Z kierowcą or Samodzielnie, the condition under it, the box when ridden yourself */
.swap { display: grid; gap: 8px; margin: 14px 0 6px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); }
.leg .swap { margin: 4px 0 0; }
.swap-h { font-weight: 600; }
.swap-seg { max-width: 360px; }
.swap-note { font-size: 13.5px; color: var(--muted); }
.swap-msg { font-size: 14px; color: var(--wet); }   /* the form gives no trip, so the choice did nothing (bindSwaps) */
.swap-box { display: grid; gap: 6px; font-size: 14px; border-left: 3px solid var(--warm); padding: 4px 0 4px 12px; }
/* The budget as the last figure of the facts, a link to its part of "Przed wyjazdem" */
.facts .f-budget a { display: grid; gap: 2px; color: inherit; text-decoration: none; }
.facts .f-budget b { font-size: clamp(24px, 2.5vw, 32px); }   /* the widest form, d ddd–dd ddd zł, fits its column (tests/probes/before.js) */
.facts .f-budget span { text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
/* Before the trip: the budget, what to book, entry and health, what to pack; two columns on a wide screen */
.before { display: grid; gap: 28px; }
@media (min-width: 900px) { .before { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 36px 48px; } }
.b-part { display: grid; gap: 10px; align-content: start; }
.b-part h3 { font-size: 24px; }
.b-sum b { font-family: var(--display); font-weight: 500; font-size: clamp(26px, 3vw, 34px); white-space: nowrap; }
.b-parts { display: grid; }
.b-parts li { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px dashed var(--line); padding: 5px 0; font-size: 15px; }
.b-note, .b-meta { font-size: 13.5px; color: var(--muted); }
.b-warn { font-size: 14px; background: var(--warm-soft); border-left: 3px solid var(--warm); padding: 8px 12px; border-radius: 4px; }
.b-book { display: grid; gap: 8px; }
.b-book li { display: grid; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 15px; }
.b-list { display: grid; gap: 6px; }
.b-list li { position: relative; padding-left: 18px; font-size: 15px; }
.b-list li::before { content: ""; position: absolute; left: 4px; top: 0.65em; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

/* Changes to the trip: Dodaj, Usuń; the places off the trip, each with why it is not on it */
.offroute { margin-top: 22px; display: grid; gap: 8px; justify-items: start; }
.off-p { color: var(--muted); font-size: 14px; max-width: 64ch; }
.off-list { display: grid; gap: 8px; width: 100%; max-width: 760px; }
.off-list li { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; align-items: start; gap: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
.off-list li > .dot { margin-top: 6px; }
.off-why { color: var(--muted); }
.off-drops { color: var(--muted); font-size: 13px; }
.off-tag { font: 11px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.btn-small { font: 500 13px var(--body); color: var(--accent); background: var(--accent-soft); border: 0; border-radius: 999px; padding: 6px 12px; min-height: 44px; cursor: pointer; }
.btn-ghost { font: 500 14px var(--body); color: var(--accent); background: none; border: 1px solid var(--accent); border-radius: 6px; padding: 8px 14px; min-height: 44px; cursor: pointer; }
.stop-remove { margin-left: auto; font: 500 13px var(--body); color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; min-height: 44px; cursor: pointer; }
.stop-remove:hover { color: var(--wet); border-color: var(--wet); }
.tag-added { margin-top: 8px; font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 4px; }

/* Strip */
.strip { display: grid; grid-template-columns: repeat(var(--cols, 16), minmax(0, 1fr)); gap: 4px; }
.cell { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; aspect-ratio: 1 / 1; border-radius: 4px; background: var(--c); color: var(--on-c); text-decoration: none; font: 600 14px var(--mono); transition: transform .15s; }
.cell:hover { transform: translateY(-2px); }
.cell.arrive::before { content: ""; position: absolute; left: 5px; top: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--on-c); opacity: 0.9; }
.cell.home { background: var(--surface); color: var(--ink); border: 1px dashed var(--muted); }
.strip-legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 14px; font-size: 14px; }
.strip-legend li { display: inline-flex; align-items: center; gap: 7px; }
.strip-legend .mono { color: var(--muted); font-size: 12px; }
.home-dot { background: transparent; border: 1px dashed var(--muted); }
.copy { margin-top: 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.pdf-hint { flex-basis: 100%; margin: 0; max-width: 62ch; font-size: 14px; color: var(--muted); }
#copy-status { font-size: 14px; color: var(--accent); }
#copy-fallback { width: 100%; max-width: 560px; font: 13px var(--mono); padding: 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }

/* Route split view */
.route { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: clamp(28px, 4vw, 56px); align-items: start; }
.map-col { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); }
.map svg { width: 100%; height: auto; max-height: calc(100vh - 80px); display: block; }
/* the map's panels apart and the link to the route: for the printout only (@media print) */
.map-print, .print-link { display: none; }
/* the zoom button exists for screen readers and keyboards only where zooming works (wide screens); display: none hides it everywhere else */
.map-hint { display: none; font: inherit; color: var(--accent); background: none; border: 0; padding: 0; cursor: zoom-in; text-align: left; }
@media (min-width: 901px) {
  .map { cursor: zoom-in; border-radius: 10px; }
  .map > svg { transition: transform 0.25s ease, filter 0.25s ease; transform-origin: 50% 0; }
  .map:hover > svg, .map:has(.map-hint:focus-visible) > svg { transform: scale(1.015); filter: drop-shadow(0 6px 16px rgba(var(--scrim), 0.16)); }
  .map-hint { display: inline; }
}
.map.mz-hide > svg { visibility: hidden; }
/* enlarged map */
.mapzoom { position: fixed; inset: 0; z-index: 45; cursor: zoom-out; }
.mapzoom::before { content: ""; position: absolute; inset: 0; background: var(--paper); opacity: 0; transition: opacity 0.48s ease; }
.mapzoom.on::before { opacity: 0.96; }
.mz-panel { position: fixed; transform-origin: 0 0; transition: transform 0.48s cubic-bezier(0.2, 0.75, 0.2, 1); will-change: transform; filter: drop-shadow(0 10px 30px rgba(var(--scrim), 0.18)); }
.mz-panel svg { width: 100%; height: 100%; display: block; }
.mz-close { position: absolute; top: 16px; right: 20px; display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 500 13px var(--body); cursor: pointer; opacity: 0; transition: opacity 0.3s ease 0.15s; }
.mapzoom.on .mz-close { opacity: 1; }
.m-grid { stroke: var(--line); stroke-width: 1; }
.m-grid-v { stroke-dasharray: 2 5; }
.m-gridlabel { fill: var(--muted); font: 10px var(--mono); }
.m-faint { fill: var(--border); }
.m-road { stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; fill: none; }
.m-fly { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 4; fill: none; }
.m-airport { fill: none; stroke: var(--ink); stroke-width: 1.6; }
.m-frame { fill: var(--sea); }
.m-edge { fill: none; stroke: var(--line); stroke-width: 1; }
.m-land { fill: var(--land); stroke: var(--border); stroke-width: 0.8; stroke-linejoin: round; }
.m-land-o { fill: var(--land-o); stroke: var(--border); stroke-width: 0.8; stroke-linejoin: round; }
.m-river { fill: none; stroke: var(--river); stroke-width: 1.1; stroke-linecap: round; stroke-linejoin: round; }
.m-country { fill: var(--muted); font: 500 9px var(--mono); letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.8; }
.m-water { fill: var(--water-ink); font: italic 400 11px var(--display); }
.m-title { fill: var(--muted); font: 500 10px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; }
.m-local { stroke-dasharray: 2 3; stroke-width: 1.6; }
.m-arrow { fill: var(--muted); }
.m-lead { stroke: var(--ink); stroke-width: 1; }
.m-apt-dot, .m-pin-dot { fill: var(--ink); }
.m-scale path { fill: none; stroke: var(--muted); stroke-width: 1.2; }
.m-scale text { fill: var(--muted); font: 9px var(--mono); }
.m-faint-label { fill: var(--muted); font: 400 10px var(--body); opacity: 0.85; paint-order: stroke; stroke: var(--land); stroke-width: 3px; stroke-linejoin: round; }
.m-dot { fill: var(--c); }
.m-poi { fill: var(--surface); stroke: var(--muted); stroke-width: 2; }
/* the label fonts are the sizes page.js measures labels with (NAME_PX, SUB_PX, SMALL_PX) */
.m-label { fill: var(--ink); font: 600 11.5px var(--body); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.m-sub { fill: var(--muted); font: 400 10px var(--mono); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.pin rect { fill: var(--c); stroke: var(--surface); stroke-width: 2; transition: transform .2s; transform-box: fill-box; transform-origin: center; }
.pin-num { fill: var(--on-c); font: 600 11px var(--mono); }
.pin.on rect { transform: scale(1.25); }
.pin.on .m-label { fill: var(--c); }
.map-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font: 12px var(--mono); color: var(--muted); }
.map-legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.map-legend svg { display: block; }

.stops { display: grid; gap: 22px; min-width: 0; }
.leg { border: 1px dashed var(--line); border-radius: 8px; padding: 12px 16px; display: grid; gap: 8px; background: transparent; }
.leg-long { border-color: var(--warm); }
.leg-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
.leg-day { font-size: 12px; color: var(--muted); }
.leg-route { font-weight: 600; }
.leg-total { margin-left: auto; font-size: 12.5px; color: var(--muted); }
.leg-segs { display: grid; gap: 4px; font-size: 14px; }
.leg-segs li { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 8px; align-items: center; color: var(--muted); }
.leg-segs li span:first-of-type { color: var(--ink); }
.leg-foot { font-size: 13.5px; color: var(--muted); }
.flag { display: inline-block; font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--warm); background: var(--warm-soft); padding: 2px 7px; border-radius: 4px; margin-right: 4px; }

.stop { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: clamp(16px, 2.4vw, 26px); display: grid; gap: var(--stop-gap); scroll-margin-top: 16px; min-width: 0; }
.stop-compact { gap: var(--stop-gap-compact); }
.stop-head { display: flex; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
.stop-num { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--c); color: var(--on-c); display: grid; place-items: center; font: 600 14px var(--mono); margin-top: 4px; }
.home-num { background: var(--ink); color: var(--paper); }
.stop-title { flex: 1 1 260px; min-width: 0; display: grid; gap: 4px; }
.stop-title h3 { font-size: clamp(28px, 3.4vw, 40px); font-weight: 400; }
.stop-compact .stop-title h3 { font-size: 24px; }
.stop-sub { color: var(--muted); font-size: 15px; }

/* Why a stay is on the trip, its weather and the events it meets */
.why { display: grid; gap: 6px; }
.why-on { font-size: 15px; }
.why-wx { font-size: 14px; color: var(--muted); }
.event { font-size: 14px; line-height: 1.5; background: var(--accent-soft); padding: 8px 12px; border-radius: 6px; }
.event b { display: block; font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); margin-bottom: 2px; }
.event-warn { background: var(--warm-soft); }
.event-warn b { color: var(--warm); }

/* Gallery */
.gal { display: grid; gap: 10px; min-width: 0; }
.gal-view { position: relative; border-radius: 8px; overflow: hidden; background: var(--line); }
.gal-track { display: grid; grid-auto-flow: column; grid-auto-columns: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; }
.gal-track::-webkit-scrollbar { display: none; }
.gal-track:focus-visible { outline-offset: -3px; }
.gal-slide { margin: 0; scroll-snap-align: start; }
.gal-open { display: block; width: 100%; padding: 0; border: 0; background: none; cursor: zoom-in; }
.gal-slide img { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; }
.gal-btn, .gal-full { position: absolute; display: grid; place-items: center; border: 0; cursor: pointer; background: var(--ctl-bg); color: var(--ctl-ink); border-radius: 50%; box-shadow: 0 1px 4px rgba(var(--black), 0.25); }
.gal-btn { top: 50%; width: 44px; height: 44px; margin-top: -22px; }
.gal-prev { left: 12px; }
.gal-next { right: 12px; }
.gal-btn:disabled { opacity: 0; pointer-events: none; }
.gal-full { top: 12px; right: 12px; width: 36px; height: 36px; border-radius: 6px; }
.gal-count { position: absolute; left: 12px; bottom: 12px; font-size: 12px; background: var(--badge-bg); color: var(--on-photo); padding: 3px 8px; border-radius: 4px; }
.gal-under { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
.gal-cap { font-size: 13.5px; color: var(--muted); flex: 1 1 240px; min-width: 0; }
.gal-thumbs { display: flex; gap: 6px; }
.gal-thumb { padding: 0; border: 2px solid transparent; border-radius: 5px; background: none; cursor: pointer; opacity: 0.7; }
.gal-thumb img { width: 56px; height: 40px; object-fit: cover; border-radius: 3px; }
.gal-thumb[aria-current="true"] { border-color: var(--accent); opacity: 1; }
.gal-thumb:hover { opacity: 1; }

/* Days */
.days { display: grid; }
.day { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 14px; padding-block: 14px; border-top: 1px solid var(--line); scroll-margin-top: 20px; }
.day:first-child { border-top: 0; padding-top: 0; }
.day-n { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.day-date { display: block; font: 12px var(--mono); color: var(--muted); text-transform: none; letter-spacing: 0; margin-top: 4px; white-space: nowrap; }
.day-n b { display: block; font: 400 30px/1 var(--display); color: var(--ink); letter-spacing: 0; text-transform: none; }
.day h4 { font-size: 17px; font-weight: 600; line-height: 1.35; margin-bottom: 4px; }
.day p { color: var(--ink); }
/* .day p sets the colour of every paragraph of a day, so the rain plan needs the stronger selector */
.day .day-rain { margin-top: 6px; font-size: 14px; color: var(--cool); }
.day-rain b { font-weight: 600; }
.tips { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.tip { font-size: 14px; line-height: 1.5; background: var(--accent-soft); padding: 10px 12px; border-radius: 6px; }
.tip b { display: block; font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); margin-bottom: 2px; }
.tip-skip { background: var(--warm-soft); }
.tip-skip b { color: var(--warm); }
.instead { display: block; margin-top: 4px; font-weight: 500; }

footer { margin-top: clamp(56px, 8vw, 96px); border-top: 1px solid var(--line); padding-block: 32px 48px; color: var(--muted); font-size: 12.5px; }
footer h2 { font: 400 11px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; margin: 18px 0 10px; }
footer h2:first-child { margin-top: 0; }
.credits { columns: 2 340px; column-gap: 32px; }
.credits li { break-inside: avoid; margin-bottom: 4px; }
footer a { color: var(--muted); }

/* Lightbox */
.lightbox { position: fixed; inset: 0; z-index: 50; background: var(--lb-bg); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; color: var(--lb-ink); padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
.lb-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; font: 13px var(--mono); }
.lb-stage { display: grid; place-items: center; min-height: 0; padding: 0 56px; }
.lb-stage img { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; border-radius: 4px; }
.lb-foot { padding: 12px 16px 18px; text-align: center; display: grid; gap: 2px; }
#lb-cap { font-size: 15px; }
#lb-credit { font-size: 12px; opacity: 0.7; }
.lb-btn { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(var(--white), 0.14); color: var(--on-photo); cursor: pointer; }
.lb-btn:disabled { opacity: 0.25; cursor: default; }
.lb-nav { position: fixed; top: 50%; margin-top: -22px; }
#lb-prev { left: 8px; }
#lb-next { right: 8px; }

@media (max-width: 900px) {
  .route { grid-template-columns: minmax(0, 1fr); }
  .map-col { position: static; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; justify-items: center; }
  .map svg { width: 100%; max-width: 360px; height: auto; max-height: none; }
  /* six figures do not fit one row (a tablet in portrait): the budget, the widest, gets a row of its own under the other
     five (tests/probes/before.js at 641 and 768 px); a phone has its own grid below */
  .facts ul { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  #facts .f-budget { grid-column: 1 / -1; border-left: 0; padding-left: 0; border-top: 1px solid var(--line); }
}
@media (max-width: 640px) {
  /* a lower photo, so the form starts on the first screen (tests/probes/settings.js) */
  .hero { min-height: 0; }
  .hero-text { padding-block: 40px 34px; }   /* room under the buttons for the place of the photo (.hero-where) */
  .hero-lede { margin-top: 10px; }
  .hero-cta { margin-top: 16px; }
  #settings.block { padding-top: 16px; }
  #shape.block { padding-top: 20px; }
  .block-head { gap: 6px; margin-bottom: 12px; }
  /* "Hồ Chí Minh City" does not fit in half a phone's width, so the airports take a row each */
  .set-airports { flex-wrap: wrap; }
  .set-airports .field-grow { flex-basis: 100%; }
  .set-arrow { display: none; }
  /* the figures in two columns; the budget, last, across both, and the one before it too when it would stand alone */
  .facts ul { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  #facts li:nth-child(odd), #facts .f-budget { border-left: 0; padding-left: 0; }
  #facts li:nth-child(n+3) { border-top: 1px solid var(--line); }
  #facts li:nth-last-child(2):nth-child(odd), #facts .f-budget { grid-column: 1 / -1; }
  .strip { grid-template-columns: repeat(8, minmax(0, 1fr)); }
  .cell { aspect-ratio: 1 / 1; }
  .day { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .day-n { display: flex; gap: 8px; align-items: baseline; }
  .day-n b { display: inline; font-size: 24px; }
  .day-date { display: inline; margin: 0; }
  .gal-thumbs { display: none; }
  .gal-btn { width: 40px; height: 40px; margin-top: -20px; }
  .lb-stage { padding: 0 8px; }
  .lb-nav { top: auto; bottom: 74px; }
  .leg-total { margin-left: 0; width: 100%; }
  /* a road's text takes the width of its card, and its time goes under it (the long texts of plan 2B) */
  .leg-segs li { grid-template-columns: 18px minmax(0, 1fr); }
  .leg-segs li > .mono { grid-column: 2; }
  /* Dodaj under its reason, at the left: the button "Na górę" (bottom right) cannot cover it */
  .off-list li { grid-template-columns: 10px minmax(0, 1fr); }
  .off-list li > .btn-small { grid-column: 2; justify-self: start; }
}
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 56px); }
.secnav { position: sticky; top: 0; z-index: 30; background: var(--surface); border-bottom: 1px solid var(--line); }
.secnav .wrap { display: flex; align-items: center; gap: 18px; }
.secnav-links { display: flex; gap: 18px; min-width: 0; overflow-x: auto; scrollbar-width: none; }

/* on a tablet the links share the bar with the summary, so they scroll, and the strip fades out at its end */
@media (min-width: 641px) and (max-width: 900px) {
  .secnav-links { -webkit-mask-image: linear-gradient(90deg, rgb(var(--black)) 85%, transparent); mask-image: linear-gradient(90deg, rgb(var(--black)) 85%, transparent); }
}
/* on a phone the links show only while the form is on the screen (class away hides them), so "Ustawienia" goes, and the
   other three fit down to 320 px */
@media (max-width: 640px) {

}
.secnav a { flex: none; padding: 12px 0; font-size: 14px; font-weight: 500; color: var(--muted); text-decoration: none; }
.secnav a:hover { color: var(--ink); }

   on a phone the summary takes the place of the links */
.secnav-sum { display: none; margin: 0 0 0 auto; min-width: 0; align-items: center; gap: 4px 12px; font-size: 14px; color: var(--ink); white-space: nowrap; }
/* on the narrowest phones the summary is cut short (…), and "Zmień" stays whole */
#sum-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.secnav.away .secnav-sum { display: flex; }
.secnav .sum-change { flex: none; color: var(--accent); font-weight: 600; padding: 12px 0 12px 8px; }
@media (max-width: 640px) {
  .secnav.away .secnav-links { display: none; }

}
.totop { position: fixed; z-index: 35; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; background: var(--surface); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 2px 10px rgba(var(--black), 0.18); }
@page { size: A4; margin: 12mm; }
@media print {
  body { background: var(--surface); }
  .hero { min-height: 0; background: none; }
  /* the settings section goes with its heading: the facts row above the route already names the airports, the term and the days */
  .secnav, .totop, .hero > img, .hero::after, .hero-where, .hero-cta, .copy, #settings, .offroute, .dropped, .stop-remove, .gal-btn, .gal-full, .gal-count, .gal-thumbs, .map-hint, .lightbox, .mapzoom, .shape-click { display: none !important; }
  .hero-text { color: var(--ink); text-shadow: none; padding-block: 0 24px; }
  .hero .eyebrow { color: var(--muted); }
  /* the map: its three panels apart across the page, north and centre side by side, the south under them with the
     legend, each about 9 cm wide (the sidebar map is for the screen); the link to the route under the title */
  .map-col { display: none !important; }
  .map-print { display: grid; grid-template-columns: 1fr 1fr; gap: 5mm; align-items: start; break-inside: avoid; margin-bottom: 8mm; }
  .map-print svg { display: block; width: 100%; height: auto; }
  .mp-legend { align-self: end; }
  .print-link { display: block; margin-top: 12px; font: 11px var(--mono); color: var(--muted); overflow-wrap: anywhere; }
  /* a stop may run over a page break; its days, journeys and boxes stay whole. Chrome prints a grid that breaks across
     pages with its later rows over the earlier ones (the tip boxes covered the last day's text), so a stop is a plain
     block here and the grid gap becomes a margin */
  .stop { display: block !important; break-inside: auto; }
  .stop > * + * { margin-top: var(--stop-gap); }
  .stop-compact > * + * { margin-top: var(--stop-gap-compact); }

  .gal { max-width: 7.5cm; break-inside: avoid; }
  /* a heading never stays alone at the bottom of a page: the eyebrow goes with its title, the title with what follows */
  .eyebrow, .facts-for, .stop-head, h2, h3, .block-head { break-after: avoid; }
  .block-head, .stop-head, .stop-title { break-inside: avoid; }
  .leg, .day, .tip { break-inside: avoid; }
  /* "Przed wyjazdem" and the motorbike's choice: blocks, not grids (as .stop above), and each of their items whole; the

  .before, .b-part, .b-book, .b-list, .b-parts, .swap { display: block !important; }

  .credits { columns: 3; column-gap: 20px; font-size: 9px; line-height: 1.35; }
  .credits li { margin-bottom: 1px; }
}

<script>

    why: { 4: ['upal'], 5: ['upal', 'deszcz'], 6: ['deszcz'], 7: ['deszcz'], 8: ['deszcz'], 9: ['deszcz'], 10: ['deszcz'] }
  },
  mekong: {

  'sw.note': 'Samodzielnie tylko z polskim prawem jazdy kategorii A1, A2 albo A i międzynarodowym prawem jazdy według konwencji wiedeńskiej, oba przy sobie. Samo B nie wystarcza nawet na skuter 110–125 cm³.',
  'sw.req.h': 'Wymagania. ', 'sw.risk.h': 'Ryzyko. ', 'sw.tips.h': 'Rady. ',
  'sw.req': 'Międzynarodowe prawo jazdy wydaje starostwo: 35 zł, zwykle od ręki, ważne do 3 lat. W motocyklu muszą być dowód rejestracyjny i polisa obowiązkowego OC, a kask zgodny z normą trzeba zapiąć, także pasażerowi. Sprawdź w warunkach swojej polisy, czy obejmuje jazdę motocyklem.',
  'sw.risk': 'Na drogach Wietnamu ginie na mieszkańca ok. 2,7 raza więcej osób niż w Polsce. Po wypadku grozi odpowiedzialność karna, odszkodowanie i zakaz wyjazdu do końca dochodzenia. Bez uprawnień grozi mandat 2–4 mln VND i zatrzymanie motocykla, a polisa może nie zapłacić. Policja kontroluje cudzoziemców.',
  'sw.tips': 'Przy odbiorze obejrzyj motocykl i zrób zdjęcia rys. Paszportu nie zostawiaj w zastaw, zapytaj o kaucję gotówką. Nie jedź po zmroku, w deszczu i mgle zwolnij, a na serpentynach uważaj na żwir i ciężarówki.',
  'sw.tips.caobang': 'Na pętli rozsądnie jest 80–100 km dziennie. Tankuj przy każdej okazji, bo za miastem stacji jest mało.',
  'sw.tips.hagiang': 'Motocykl weź i oddaj w mieście Hà Giang. Na pętli rozsądnie jest 100–150 km dziennie, więc ruszaj rano; najostrzejsze zakręty i najwięcej ciężarówek są na przełęczach Bắc Sum i Mã Pí Lèng. Đồng Văn, Mã Pí Lèng i Lũng Cú leżą w strefie przygranicznej: pozwolenie za 10 USD wydaje urząd imigracyjny policji w mieście Hà Giang, a załatwia je też hotel. Nie zbaczaj w drogi ku granicy.',
  'sw.risk.hagiang': 'Od 12 kwietnia 2026 drogę do Đồng Văn sprawdza policja prowincji, zwłaszcza cudzoziemców na wypożyczonych motocyklach, a część wypożyczalni i biur (ok. 30) zobowiązała się nie wydawać motocykla bez wymaganych uprawnień. W 2026 na pętli zginęły dwie turystki, obie na tylnym siodełku motocykla miejscowego kierowcy.',
  'sw.tips.haivan': 'Przez przełęcz jedzie się tylko górą, bo motocykle nie wjeżdżają do tunelu. Wyjedź rano, przed ruchem i mgłą.',

/* ---------- weather, events and the season of an interest ---------- */
var RAIN_PLAN_DAYS = 10;   // a day's rain plan shows in a month with this many days of rain or more (climate.js, as the page rounds it)

   one entry for each month the stay's days (start…end) fall in, in order, the numbers rounded as the page shows them.
   stop: { id, start, n }; months: st.months (0–11 for each trip day); climate: CLIMATE; seasons: SEASONS. */
function stayWeather(stop, months, climate, seasons) {
  var c = climate[stop.id], out = [];

    var m = months[d - 1] + 1;
    if (out.length && out[out.length - 1].month === m) continue;
    out.push({ month: m, season: seasons[stop.id].charAt(m - 1), t: [Math.round(c.t[m - 1][0]), Math.round(c.t[m - 1][1])],

  }
  return out;
}

function rainyMonth(placeClimate, month) { return Math.round(placeClimate.rain[month - 1][1]) >= RAIN_PLAN_DAYS; }

/* The events and seasonal notes of a place that a stay meets: the entries of c.events ({ from, to, t, warn }; from and to
   as [month, day], every year, and a window may run over the new year) that touch the stay's days (start…end). With dates

   c: the place's content; stop: { start, n }; st: normSettings' result. */

  var days = [], d, iso;   // each day as month × 100 + day
  if (st.start) for (d = stop.start; d < stop.start + stop.n; d++) { iso = tripDate(st.start, d); days.push(+iso.slice(5, 7) * 100 + +iso.slice(8)); }
  else for (d = 1; d <= 31; d++) days.push(st.month * 100 + d);

    var a = e.from[0] * 100 + e.from[1], b = e.to[0] * 100 + e.to[1];
    return days.some(function (x) { return a <= b ? x >= a && x <= b : x >= a || x <= b; });

}

/* The chosen interests that the trip serves badly. For each chosen interest, the stays that serve it (fit 2 or more; a

   (Z), { interest, ids: their places, each once, why: the reasons of those months, each once, months: those months (1–12),
   each once, in order }. Otherwise nothing. route: planRoute's trip; st: normSettings' result; climate: CLIMATE. */

  st.interests.forEach(function (k) {
    var serving = route.stops.filter(function (s) { return !places[s.id].node && (places[s.id].fit[k] || 0) >= 2; });
    if (!serving.length) { out.push({ interest: k, none: true }); return; }
    if (!serving.every(function (s) { return /^Z+$/.test(s.season); })) return;

      }

}

/* ---------- the trip ---------- */

  route.stops.forEach(function (s) { if (!places[s.id].node && !seen[s.id]) { seen[s.id] = true; out.places++; } });
  route.stops.map(function (s) { return s.leg; }).concat([route.home]).forEach(function (L) {

  return out;
}

/* The places that left the trip when Dodaj changed it, in the order of the old trip, for the sentence after Dodaj: on the

/* The places that stay on the trip after Dodaj, but with fewer nights, in the order of the old trip: the nights of a place

}

/* ---------- why a place is on the trip or not ---------- */
/* Why stay i of the trip is on it, for "Wybrane, bo…". A night on the way: { night: [the place before, the place after] }.
   Otherwise { added, airport, interests, way, months }: added: Dodaj asked for it; airport: 'from' when it opens the trip
   as the city of the arrival airport, 'to' when it closes the trip as the city of the departure airport, else null;
   interests: the chosen interests it serves (fit 2 or more), or, with none chosen, its two strongest of fit 2 or more
   (by fit, then in the order of INTERESTS); way: interests are chosen, it serves none and is no airport's city (it fills
   the days on the way); months: [{ month: 1–12, season }] of its days, each month once, in order.
   route: planRoute's trip; st: normSettings' result; hubs: HUBS. */
function whyOn(route, i, st, places, hubs) {

  var chosen = st.interests.filter(function (k) { return (p.fit[k] || 0) >= 2; });
  var strongest = INTERESTS.filter(function (k) { return (p.fit[k] || 0) >= 2; })
    .sort(function (a, b) { return p.fit[b] - p.fit[a] || INTERESTS.indexOf(a) - INTERESTS.indexOf(b); }).slice(0, 2);
  var airport = i === 0 && s.id === hubs[st.from] ? 'from' : i === last && s.id === hubs[st.to] ? 'to' : null;
  for (var d = s.start; d < s.start + s.n; d++) {
    var m = st.months[d - 1] + 1;
    if (!months.length || months[months.length - 1].month !== m) months.push({ month: m, season: s.season.charAt(d - s.start) });
  }
  return { added: st.add.indexOf(s.id) > -1, airport: airport, interests: st.interests.length ? chosen : strongest,
    way: st.interests.length > 0 && !chosen.length && !airport, months: months };
}

/* Why each place off the trip is not on it, south to north: every place without a node that is no stay of the trip.
   reasons, each one that holds, in this order: 'removed' (Usuń took it off); 'level' (it needs a higher level); 'closed'
   (closed, X, in every month of the trip); 'season' (poor, Z, in every month of the trip); 'profile' (interests are chosen
   and it serves none of them, fit under 2); 'far' (it does not fit in: with it added, the trip leaves it missing). When
   none holds: 'beaten' (with this many days, other places scored more). why: the reasons of its poor months (CLIMATE),

   Returns [{ id, reasons, why, canAdd, drops, shorter, added }]. settings: as in the link (Dodaj builds on them); st: their

   a night on the way is no place to report, a city twice on a round trip counts once). */

    came: droppedPlaces(after, before, places).filter(function (id) { return id !== added; }) };

/* The swaps (SWAPS in content.js) set to „Samodzielnie” in the settings, as the other functions take them: places, the

}

/* ---------- the budget ---------- */
/* A rough budget for a person, in euros, without the flights to Vietnam: { two, one, parts, items }. two is [from, to] for
   each of two people who share a room, a car, a boat and a guide; one for a person alone, who pays all of them. parts: the
   same split into nights, day (food, Grab, small tickets), travel (roads and domestic flights) and trips (the paid parts of
   the plans); items: the paid things of the trip, each key once with its cost over the whole trip, the domestic flights as
   'flights', dearest first (by to for two; a tie keeps the order of the trip). The rules:
   - a stay's nights cost the room of its place (a night on the way: its node's); an item with night: true (the cruise, the
     night at the rangers' station) has its own room, so its stay counts a night less;
   - each day of the trip costs day, and a person alone pays daySolo more;
   - a road segment costs from a seat in a van (shared) to a car with its driver (car) for its hours; the road of a swap

   - a flight costs flight.short up to shortFlightH hours in the air, else flight.long;
   - a plan's cost entry: an item costs pp + group / 2 for two, pp + group for one; a choice (a list) from its cheapest to its
     dearest, under the name of its first item.
   route: planRoute's trip; plans: stopDays of each stay; moto: the swaps set to „Samodzielnie”; data: { costs: COSTS,

  ['nights', 'day', 'travel', 'trips'].forEach(function (k) { parts[k] = { two: [0, 0], one: [0, 0] }; });

/* ---------- before the trip ---------- */

/* What to book ahead on this trip, the most urgent first (by ahead in BOOK; a tie keeps the order of the trip):
   [{ key, ahead, links, two, one, list, items }], key a key of BOOK with ahead over 0. two, one: what it costs a person, as
   tripBudget counts it (a long road from an airport: the car), or null when its cost is part of the stays or the travel
   (homestay, transfer); list: what it is about: the flights as [from, to] codes, the roads from airports as [code, place,
   rides] (each road once, rides 2 when the trip takes it both ways, and its cost counts every ride), the homestays as
   places; items: the items of COSTS booked under the key, each once, in the order of the trip. The keys: flights (any domestic flight);
   airport (a road of AIR_KEYS with book); transfer (a road between two places, but the road of a swap); homestay (a stay
   in a place of homestays); and the book key of each item of the plans and of a swap's road (item.book, or the item's own

  function entry(key) {

        var seen = e && e.list.filter(function (x) { return x[0] === code && x[1] === place; })[0];

/* Page logic: reads the settings (the link or the form), plans the trip with the engine (engine.js) and renders the facts,

  function fmtH(h) {

    if (mins < 60) return mins + ' ' + T('min');

    return mm ? T('fmt.hm', { h: hh, m: mm }) : hh + ' ' + T('h');
  }
  function approx(h) {
    var r = Math.round(h * 2) / 2, whole = Math.floor(r);
    return '≈ ' + (r % 1 ? (whole ? whole : '') + '½' : whole) + ' ' + T('h');
  }
  function dayRange(a, b) { return a === b ? T('day') + ' ' + a : T('days') + ' ' + a + '–' + b; }
  // the weekday and date of trip day n, only when the trip has dates: "czw. 28.01", short enough for one line under the number
  function dateLabel(day) {
    var iso = tripDate(state.st.start, day);
    if (!iso) return '';
    var p = iso.split('-').map(Number);
    var wd = new Date(Date.UTC(p[0], p[1] - 1, p[2])).toLocaleDateString('pl-PL', { weekday: 'short', timeZone: 'UTC' });
    return wd + '\u00a0' + p[2] + '.' + (p[1] < 10 ? '0' : '') + p[1];
  }
  // "w marcu", "we wrześniu" (we before w and a consonant)
  function inMonth(m) { var noun = T('monl.' + m); return (/^w[^aeiouyąęó]/i.test(noun) ? 'we ' : 'w ') + noun; }
  // the short names of places, for a sentence
  function names(ids) { return ids.map(function (id) { return C(id).short; }).join(', '); }
  function capFirst(t) { return t.charAt(0).toUpperCase() + t.slice(1); }
  // an amount in euros, [from, to], in złoty: rounded to 100 zł (or step), thousands apart: "2 600–5 900 zł", or "30 zł" when
  // both ends round alike; nothing is "0 zł"
  function zl(eur, step) {
    if (eur[1] <= 0) return '0\u00a0zł';
    var r = zlRange(eur, EUR_PLN, step || 100);
    return r[0] === r[1] ? T('zl.one', { a: money(r[0]) }) : T('zl', { a: money(r[0]), b: money(r[1]) });
  }
  // names for a sentence: "A", "A i B", "A, B i C"
  function andList(list) { return list.length < 2 ? list.join('') : list.slice(0, -1).join(', ') + ' i ' + list[list.length - 1]; }
  function termText(st) {
    return st.start ? fmtSpan(st.start, tripDate(st.start, st.days)) : T('term.month', { month: T('mon.' + st.month), year: st.year });
  }

  /* ---------- state ---------- */
  var DATA = { places: PLACES, seasons: SEASONS, graph: travelGraph(ROADS, FLIGHTS), hubs: HUBS };
  var BUDGET_DATA = { costs: COSTS, places: PLACES, swaps: SWAPS, shortFlightH: SHORT_FLIGHT_H };
  var BOOK_DATA = { costs: COSTS, book: BOOK, swaps: SWAPS, places: PLACES, airports: AIRPORTS, airKeys: AIR_KEYS, homestays: HOMESTAYS, shortFlightH: SHORT_FLIGHT_H };
  var PACK_DATA = { climate: CLIMATE, seasons: SEASONS, content: CONTENT, places: PLACES, swaps: SWAPS };
  var TODAY = clampToday(new Date().toISOString().slice(0, 10), HOLIDAYS_FROM, PLAN_LAST_YEAR);   // the device clock, held inside the days the page plans for
  var DEFAULTS = defaultSettings(TODAY, DATA, { list: HOLIDAYS, from: HOLIDAYS_FROM, until: HOLIDAYS_UNTIL, tetMargin: TET_MARGIN_DAYS });
  // settings: as in the link; st: checked by normSettings; route: planRoute's trip; plans: the day plans of each stay;
  // budget: tripBudget of the trip; linkWarn: the link that opened the page was partly wrong (said in the warnings until the next change)
  var state = { settings: null, st: null, route: null, plans: null, budget: null, linkWarn: false };

  function msg(text) { $('#settings-msg').textContent = tied(text); }

  /* New settings: plan the trip; when there is one, show it and write the settings into the address. Otherwise keep the

  function apply(s, linkWarn) {

      return false;
    }
    var done = {};
    state.settings = s; state.st = st; state.route = r; state.linkWarn = !!linkWarn;

      var days = stopDays(C(x.id), x, done[x.id] || 0, st.level, st.months, legAfter(r, i), !!self.places[x.id]);
      done[x.id] = (done[x.id] || 0) + x.n;
      return days;
    });
    state.budget = tripBudget(r, state.plans, s.moto, BUDGET_DATA);
    msg('');
    $('#dropped').textContent = '';   // the sentence of the last Dodaj is about the trip that is gone
    var h = linkHash(s);
    if (location.hash !== h) {
      try { history.replaceState(null, '', h); } catch (e) { location.replace(h); }
    }
    render();
    return true;
  }

  /* The settings in the address: a link someone sent, or the defaults. A link whose Dodaj and Usuń leave no trip opens

  function fromLink() {
    var bad = [], got = settingsFromLink(parseLink(location.hash, bad), DEFAULTS, PLACES, HUBS, bad, SWAPS);
    if (!apply(got.settings, got.dropped.length > 0)) apply(withoutChanges(got.settings), true);
    syncForm();
  }

  /* ---------- the settings form ---------- */
  var F = null;
  function buildForm() {
    F = $('#settings-form');
    var days = [];
    for (var d = MIN_DAYS; d <= MAX_DAYS; d++) days.push('<option value="' + d + '">' + d + '</option>');
    F.days.innerHTML = days.join('');
    var airports = Object.keys(HUBS).map(function (code) { return '<option value="' + code + '">' + esc(AIRPORTS[code].name) + '</option>'; }).join('');
    F.from.innerHTML = airports;
    F.to.innerHTML = airports;
    $('#interest-list').innerHTML = INTERESTS.map(function (k) {
      return '<label class="chip"><input type="checkbox" name="interest" value="' + k + '"><span>' + T('int.' + k) + '</span></label>';
    }).join('');
    $('#level-list').innerHTML = LEVELS.map(function (n) {
      return '<label><input type="radio" name="level" value="' + n + '"><span>' + T('lvl.' + n) + '</span></label>';
    }).join('');
    F.start.min = TODAY;
    F.start.max = PLAN_LAST_YEAR + '-12-31';
    F.addEventListener('submit', function (e) { e.preventDefault(); });
    F.addEventListener('change', onFormChange);
  }
  // the months on offer, plus the month of a link from outside that range, so the form always shows the settings
  function monthOptions(s) {
    var list = monthChoices(TODAY, PLAN_LAST_YEAR);
    if (s.year && !list.some(function (m) { return m.year === s.year && m.month === s.month; })) list.unshift({ year: s.year, month: s.month });
    F.month.innerHTML = list.map(function (m) {
      return '<option value="' + m.year + '-' + m.month + '">' + T('mon.' + m.month) + ' ' + m.year + '</option>';
    }).join('');
  }
  /* What follows the form as it stands, also after a change that gave no trip: once two interests are chosen, the other
     three are greyed out; under the levels, the words of the chosen one. */
  function syncLocks() {
    var two = F.querySelectorAll('input[name=interest]:checked').length >= 2;
    Array.prototype.forEach.call(F.querySelectorAll('input[name=interest]'), function (b) { b.disabled = two && !b.checked; });
    $('#level-note').textContent = tied(T('lvlp.' + F.level.value));
  }
  /* The form shows state.settings. */
  function syncForm() {
    var s = state.settings, dates = !!s.start;
    monthOptions(s);
    F.mode.value = dates ? 'dates' : 'month';
    $('#term-month').hidden = dates;
    $('#term-dates').hidden = !dates;
    if (dates) { F.start.value = s.start; F.end.value = s.end; F.end.min = s.start; }
    else { F.month.value = s.year + '-' + s.month; F.days.value = String(s.days); }
    F.from.value = s.from;
    F.to.value = s.to;
    F.level.value = String(s.level);
    Array.prototype.forEach.call(F.querySelectorAll('input[name=interest]'), function (b) { b.checked = s.interests.indexOf(b.value) > -1; });
    syncLocks();
  }
  function readForm() {
    var s = { from: F.from.value, to: F.to.value, interests: [], level: +F.level.value,
      add: state.settings.add.slice(), remove: state.settings.remove.slice(), moto: state.settings.moto.slice() };
    if (F.mode.value === 'dates') { s.start = F.start.value; s.end = F.end.value; }
    else {
      var ym = F.month.value.split('-');
      s.year = +ym[0]; s.month = +ym[1]; s.days = +F.days.value;
    }
    Array.prototype.forEach.call(F.querySelectorAll('input[name=interest]'), function (b) { if (b.checked) s.interests.push(b.value); });
    return s;
  }
  /* A change in the form. Switching between the month and the dates keeps the trip: the first of the month (or today)

        s.end = tripDate(first, st.days);
      } else if (e.target.value === 'month' && s.start) {

  /* Links inside the page (a day in the strip, the menu, back to the top) scroll without changing the address, which

    road: '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M5 11l1.5-4.5A2 2 0 0 1 8.4 5h7.2a2 2 0 0 1 1.9 1.5L19 11v7h-2v-2H7v2H5zm2.5 2a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm9 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zM7 11h10l-1-3.5H8z"/></svg>',
    prev: '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M15 5l-7 7 7 7"/></svg>',
    next: '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>',
    expand: '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>'
  };

  /* The settings in short, for the bar at the top: "mar 2027 · 15 dni · Aktywnie", or with dates "28.01–14.02.2027 · …". */
  function summaryText(st) {
    var term = st.start ? fmtSpan(st.start, tripDate(st.start, st.days)) : T('mon3.' + st.month) + ' ' + st.year;
    return T('sum', { term: term, days: st.days, level: T('lvl.' + st.level) });
  }

  function render() {
    $('#sum-text').textContent = summaryText(state.st);
    renderFacts();
    renderShape();
    renderOffRoute();
    renderMap();
    renderStops();
    renderBefore();
    $('#copy-status').textContent = '';
    $('#copy-fallback').hidden = true;
    // the printout names this route's address on the public page (as the copied plan does)
    var url = SITE_URL + linkHash(state.settings);
    $('#print-link').innerHTML = esc(T('pt.link')) + '<a href="' + esc(url) + '">' + esc(url) + '</a>';
    tieShortWords(document.body);
  }

  function renderFacts() {
    var r = state.route, st = state.st, k = routeStats(r, state.plans, PLACES), n = r.days - 1;
    $('#facts-for').textContent = T('f.for', { from: AIRPORTS[st.from].name, to: AIRPORTS[st.to].name, term: termText(st) });
    $('#facts').innerHTML =
      '<li><b>' + r.days + '</b><span>' + T('f.days', { nights: n + ' ' + countWord('nights', n) }) + '</span></li>' +
      '<li><b>' + k.places + '</b><span>' + countWord('f.places', k.places) + '</span></li>' +
      '<li><b>' + k.flights + '</b><span>' + countWord('f.flights', k.flights) + '</span></li>' +
      '<li><b>' + k.hikes + '</b><span>' + countWord('f.hikes', k.hikes) + '</span></li>' +
      // the longest day: its number large and its unit small, so the widest (8½ godz.) fits its tile (tests/probes/before.js)
      '<li><b>' + approx(k.longest).replace('≈ ', '').replace(' ' + T('h'), '') + '<small>\u00a0' + T('h') + '</small></b><span>' + T('f.longest') + '</span></li>' +
      '<li class="f-budget"><a href="#before" aria-label="' + esc(T('f.budget.aria', { x: zl(state.budget.two) })) + '"><b>' + zl(state.budget.two) + '</b><span>' + T('f.budget') + '</span></a></li>';
    // first a link that was partly wrong, then a term that has passed (an old link keeps its trip, and says so), then the
    // holidays; the missing holiday dates only for a term still ahead
    var a = tripAlerts(st, HOLIDAYS, HOLIDAYS_FROM, HOLIDAYS_UNTIL, TET_MARGIN_DAYS), passed = termPassed(st, TODAY), lines = [];
    if (state.linkWarn) lines.push(T('set.dropped'));
    if (passed) lines.push(T('alert.past'));
    a.hits.forEach(function (h) { lines.push(T('alert.' + h.kind, { name: h.name, span: fmtSpan(h.from, h.to) })); });
    // a chosen interest whose places on the trip are all in a poor season, or that no place on the trip serves
    interestAlerts(r, st, PLACES, CLIMATE).forEach(function (x) {
      var what = T('int.' + x.interest);
      lines.push(x.none ? T('alert.int_none', { x: what }) : T(x.ids.length > 1 ? 'alert.int_bad_many' : 'alert.int_bad',
        { x: what, when: x.months.map(inMonth).join(' i '), places: x.ids.map(function (id) { return C(id).short; }).join(' i '),
          why: x.why.map(function (w) { return T('wx.' + w); }).join(', ') }));
    });
    if (a.unknown && !passed) lines.push(T('alert.nodata'));
    $('#alerts').innerHTML = lines.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('');
    $('#alerts').hidden = !lines.length;
  }

  function renderShape() {
    var r = state.route, cells = [];
    $('#shape-h2').textContent = T('shape.h2', { days: r.days });
    r.stops.forEach(function (s, i) {
      state.plans[i].forEach(function (d, k) {
        var label = T('day') + ' ' + d.day + ': ' + C(s.id).short + ', ' + d.t + (dateLabel(d.day) ? ' (' + dateLabel(d.day) + ')' : '');
        cells.push('<a class="cell' + (k === 0 ? ' arrive' : '') + '" href="#day-' + d.day + '" style="--c:' + stopColor(s.id) +
          '" aria-label="' + esc(label) + '"><span>' + d.day + '</span></a>');
      });
    });
    cells.push('<a class="cell home" href="#day-' + r.days + '" aria-label="' + esc(T('flyhome.aria', { days: r.days, airport: AIRPORTS[state.st.to].name })) +
      '"><span>' + r.days + '</span>' + ICON.fly + '</a>');
    $('#strip').innerHTML = cells.join('');
    $('#strip').style.setProperty('--cols', Math.min(r.days, 16));
    $('#strip-legend').innerHTML = r.stops.map(function (s) {
      return '<li><span class="dot" style="--c:' + stopColor(s.id) + '"></span>' + esc(C(s.id).short) + ' <span class="mono">' + dayRange(s.start, s.end) + '</span></li>';
    }).join('') + '<li><span class="dot home-dot"></span>' + T('flyhome') + ' <span class="mono">' + T('day') + ' ' + r.days + '</span></li>';
    $('#missing').textContent = r.missing.length ? T('missing', { x: r.missing.map(function (id) { return C(id).short; }).join(', ') }) : '';
  }

  /* Why stay i is on the trip ("Wybrane, bo…"), and, on a full card, its weather in the month or months of its days and the
     events of the place that it meets. */
  function seasonPhrase(months) {
    if (months.every(function (m) { return m.season === months[0].season; })) {
      return inMonth(months[0].month) + months.slice(1).map(function (m) { return ' i ' + T('monl.' + m.month); }).join('') + ' ' + T('season.' + months[0].season);
    }
    return months.map(function (m) { return inMonth(m.month) + ' ' + T('season.' + m.season); }).join(', ');
  }
  // the weather of a stay, month by month; a number of days of rain keeps its words on its line ("12 dni z deszczem")
  function weatherLine(list) {
    return T('wx.first', { when: inMonth(list[0].month), x: list.map(function (w, k) {
      return (k ? inMonth(w.month) + ': ' : '') + T('wx.month', { t: w.t[0] + '–' + w.t[1], mm: w.mm, days: w.days + '\u00a0' + countWord('wx.days', w.days) }) +
        (w.why.length ? ' (' + w.why.map(function (c) { return T('wx.' + c); }).join(', ') + ')' : '');
    }).join('; ') });
  }
  function stayFacts(i, compact) {
    var s = state.route.stops[i], w = whyOn(state.route, i, state.st, PLACES, HUBS), parts = [], html;
    if (w.night) return '<p class="why-on">' + esc(T('why.night', { a: C(w.night[0]).short, b: C(w.night[1]).short })) + '</p>';
    if (w.added) parts.push(T('why.added'));
    if (w.airport) parts.push(T('why.' + w.airport));
    w.interests.forEach(function (k) { parts.push(T('int.' + k).toLowerCase()); });
    if (w.way) parts.push(T('why.way'));
    parts.push(seasonPhrase(w.months));
    html = '<p class="why-on">' + esc(T('why.on', { x: parts.join(', ') })) + '</p>';
    if (compact) return html;
    html += '<p class="why-wx">' + esc(weatherLine(stayWeather(s, state.st.months, CLIMATE, SEASONS))) + '</p>';
    stayEvents(C(s.id), s, state.st).forEach(function (e) {
      html += '<p class="event' + (e.warn ? ' event-warn' : '') + '"><b>' + T(e.warn ? 'ev.warn' : 'ev.event') + '</b>' + esc(e.t) + '</p>';
    });
    return html;
  }

  // one day of a stay; its rain plan only when wet: in a month with many days of rain (rainyMonth in page.js)
  function dayItem(d, wet) {
    return '<li class="day" id="day-' + d.day + '"><div class="day-n mono">' + T('day') + ' <b>' + d.day + '</b>' +
      (dateLabel(d.day) ? '<span class="day-date">' + esc(dateLabel(d.day)) + '</span>' : '') + '</div>' +
      '<div class="day-body"><h4>' + esc(d.t) + ' <span class="pace pace-' + d.pace + '">' + T('pace.' + d.pace) + '</span>' +
      (d.variant ? ' <span class="pace pace-' + d.variant + '">' + T('badge.' + d.variant) + '</span>' : '') +
      (d.early ? ' <span class="pace pace-early">' + T('early') + '</span>' : '') + '</h4>' +
      '<p>' + esc(d.d) + '</p>' + (d.rain && wet ? '<p class="day-rain"><b>' + T('t.rain') + '</b>' + esc(d.rain) + '</p>' : '') + '</div></li>';
  }
  function tips(c) {
    var t = '';
    if (c.gem) t += '<p class="tip"><b>' + T('t.gem') + '</b>' + esc(c.gem) + '</p>';
    if (c.skip) t += '<p class="tip tip-skip"><b>' + T('t.skip') + '</b>' + esc(c.skip) + ' <span class="instead">' + T('t.instead') + esc(c.instead) + '</span></p>';
    return t ? '<div class="tips">' + t + '</div>' : '';
  }
  // sizes: how wide the photo is drawn, so the browser picks the smallest copy from srcset (the offline file has none)
  function img(id, cls, sizes) {
    var p = PHOTOS[id];
    return '<img class="' + (cls || '') + '" src="' + p.src + '" alt="' + esc(caption(id)) + '" width="' + p.w + '" height="' + p.h +
      '" loading="lazy" decoding="async"' + (p.srcset && sizes ? ' srcset="' + p.srcset + '" sizes="' + sizes + '"' : '') + '>';
  }

  function gallery(id) {

      return '<figure class="gal-slide"><button type="button" class="gal-open" tabindex="-1" data-i="' + i + '" aria-label="' + esc(T('g.open', { i: i + 1, n: ids.length })) + '">' +
        img(ph, '', '(max-width: 900px) calc(100vw - 64px), 760px') + '</button></figure>';

    var thumbs = ids.map(function (ph, i) {
