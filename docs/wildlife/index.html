/* The wildlife subpage (stage 6): the colours, the fonts and the base rules of the page with the route (build.py copies its
   :root tokens here), then its own: a heading with the switch EN · PL, three tabs, cards, tiles and the field guide. */
:root {
  --paper: #eef2ef;
  --surface: #ffffff;
  --ink: #13221f;
  --muted: #55675f;
  --line: #d3ddd8;
  --accent: #0c6a5a;
  --accent-soft: #d8eae4;
  --warm-soft: #f4e7cc;
  --warm: #8a5a00;
  --cool-soft: #dde8f4;
  --cool: #23558a;
  --wet-soft: #f5dcd6;
  --wet: #9b3826;
  --lilac-soft: #e8e2f3;
  --on-c: #ffffff;
  --on-photo: #ffffff;
  --shade: rgba(6, 16, 14, 0.78);
  /* over photos, in the photo viewer and in shadows: the same in light and dark (rgb triplets go into rgba(var(--x), a)) */
  --photo-bg: #10201c; --scrim: 6, 16, 14; --black: 0, 0, 0; --white: 255, 255, 255;
  --ctl-bg: rgba(250, 252, 251, 0.92); --ctl-ink: #13221f; --badge-bg: rgba(10, 20, 18, 0.72); --lb-bg: rgba(6, 12, 11, 0.95); --lb-ink: #f2f5f4;
  --stop-gap: 18px; --stop-gap-compact: 10px;
  --sea: #dbe8ef; --land: #fbfaf5; --land-o: #e9ebe4; --border: #a8b4ae; --river: #8fb8cf; --water-ink: #5a7f96;
  /* the colours of the places (palette numbers in content/<id>.js, field color); 14–20 wait for new places */
  --pal-1: #4b5a66; --pal-2: #82552c; --pal-3: #12707e; --pal-4: #4a7426; --pal-5: #2d7552; --pal-6: #a1443a; --pal-7: #3f4a9e;
  --pal-8: #5c7520; --pal-9: #23676a; --pal-10: #2b5f9b; --pal-11: #9a3f6e; --pal-12: #6e4fa0; --pal-13: #946000; --pal-14: #b0305a;
  --pal-15: #5146a8; --pal-16: #2f6b3a; --pal-17: #a3500f; --pal-18: #7a3d8a; --pal-19: #1f6286; --pal-20: #646419;
  --display: "Newsreader", "Iowan Old Style", Georgia, serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --gutter: clamp(16px, 4vw, 40px);
}
/* dark colours on screen only: a printout is always dark ink on white paper */

  :root:not([data-theme="light"]) {

    --accent: #5cc4ad; --accent-soft: #163a32; --warm-soft: #3a2e14; --warm: #e8b856; --cool-soft: #172c42; --cool: #8ab8ec;
    --wet-soft: #43211b; --wet: #f09a85; --lilac-soft: #2b2440; --on-c: #0c1513; --sea: #0b1a26; --land: #26372f; --land-o: #18231f; --border: #4a5d55; --river: #2f5a6e; --water-ink: #7fa6bd;
    --pal-1: #b2c1cc; --pal-2: #d9a874; --pal-3: #5fcad8; --pal-4: #a2d16f; --pal-5: #6fcf9d; --pal-6: #ee8f80; --pal-7: #a9b1f0;
    --pal-8: #c3d975; --pal-9: #6cc6c0; --pal-10: #86b4ee; --pal-11: #ec96c3; --pal-12: #bba0ec; --pal-13: #f0bb4f; --pal-14: #f59ab8;

* { box-sizing: border-box; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.6; }
img { display: block; max-width: 100%; height: auto; }
a { color: var(--accent); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; font-family: var(--display); font-weight: 500; line-height: 1.1; text-wrap: balance; }
p, ul { margin: 0; }
p { text-wrap: pretty; }
::selection { background: var(--accent); color: var(--surface); }
ul { padding: 0; list-style: none; }
.wrap { max-width: 1200px; margin: 0 auto; padding-inline: var(--gutter); }
.btn-small { display: inline-flex; align-items: center; min-height: 44px; padding: 8px 14px; border-radius: 6px; background: var(--accent); color: var(--surface); font: 500 14px var(--body); text-decoration: none; }
.btn-small:hover { filter: brightness(1.08); }

/* heading and tabs: the photo at the top (finishing touches, finding 4), the way back, EN · PL and the title on it, as on the
   page with the route; a little lower than there, so on a laptop (1366 × 860) the tabs under it stand on the first screen */
.w-head { background: var(--surface); border-bottom: 1px solid var(--line); }
.w-hero { position: relative; overflow: hidden; background: var(--photo-bg); }
.w-hero > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 28%; transform-origin: 50% 28%; }
.w-hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(var(--scrim), 0.5) 0%, rgba(var(--scrim), 0.1) 26%, rgba(var(--scrim), 0.2) 50%, var(--shade) 100%); }
.w-hero-in { position: relative; z-index: 1; display: flex; flex-direction: column; justify-content: space-between; gap: 40px; min-height: clamp(380px, 54vh, 580px);
  padding-block: 6px 34px; color: var(--on-photo); text-shadow: 0 1px 14px rgba(var(--black), 0.4); }
.w-where { position: absolute; z-index: 1; right: var(--gutter); bottom: 10px; font: 12px var(--mono); color: var(--on-photo); opacity: 0.85; }
/* on a wide screen the square photo stands in the right two thirds, fading into the dark on its left, so the douc keeps its
   face and shoulders and the title stands beside it, not on it (a crop the width of the screen showed its eyes alone, and
   at 1024 × 768 the title on its mouth: from 901 px, the page's own step, final review of the finishing touches) */
@media (min-width: 901px) {
  .w-hero > img { left: auto; width: 66%; -webkit-mask-image: linear-gradient(90deg, transparent, #000 36%); mask-image: linear-gradient(90deg, transparent, #000 36%); }
}
.w-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 44px; }
.w-top a { display: inline-flex; align-items: center; min-height: 44px; font-size: 15px; color: var(--on-photo); }
.lang-switch { display: flex; align-items: center; font: 500 13px var(--mono); letter-spacing: 0.08em; color: var(--on-photo); }
.lang-switch button { min-width: 44px; min-height: 44px; padding: 0 8px; border: 0; background: none; color: inherit; font: inherit; letter-spacing: inherit; cursor: pointer; opacity: 0.78; }
.lang-switch button[aria-pressed="true"] { opacity: 1; text-decoration: underline 2px; text-underline-offset: 5px; }
.w-eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.85; }
.w-head h1 { font-size: clamp(40px, 6.6vw, 76px); font-weight: 400; letter-spacing: -0.02em; margin-top: 6px; }
.w-lead { max-width: 58ch; margin-top: 10px; font-size: clamp(16px, 1.4vw, 18px); opacity: 0.94; }
.w-tabs { display: flex; gap: 4px; margin-top: 6px; overflow-x: auto; }
.w-tabs a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-bottom: 3px solid transparent; color: var(--muted); font-weight: 500; text-decoration: none; white-space: nowrap; }
.w-tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
@media (max-width: 374px) { .w-tabs { gap: 0; } .w-tabs a { padding: 0 7px; } }

main { padding-block: 28px 48px; }
.w-intro h2 { font-size: clamp(26px, 4vw, 36px); }
.w-intro p { max-width: 70ch; margin-top: 8px; color: var(--muted); }
.w-tripbox { margin-top: 18px; padding: 12px 16px; border-radius: 8px; background: var(--accent-soft); }
.w-legend { margin-top: 14px; font-size: 14px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.w-group { margin-top: 34px; font-size: 24px; }
.w-group small { font: 500 14px var(--mono); color: var(--muted); }
.w-muted { color: var(--muted); }
.w-ok { color: var(--accent); font-weight: 500; }
.w-no { color: var(--wet); font-weight: 500; }
.w-kind { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12.5px; background: var(--accent-soft); color: var(--ink); }
.w-kind-rescue { background: var(--warm-soft); }
.w-kind-program { background: var(--cool-soft); }
.w-dots { font-family: var(--mono); letter-spacing: 1px; color: var(--accent); }
.w-iucn { display: inline-block; align-self: flex-start; margin-top: 6px; padding: 1px 8px; border-radius: 4px; font: 500 12px var(--mono); background: var(--line); }
.w-iucn-cr { background: var(--wet-soft); color: var(--wet); }
.w-iucn-en { background: var(--warm-soft); color: var(--warm); }

/* On your route: cards */
/* one card a row, its photo the column's width (19.10.2026: big photos, the map beside them) */
.w-cards { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; margin-top: 16px; }
.w-card { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.w-photo { display: block; width: 100%; padding: 0; border: 0; background: var(--photo-bg); cursor: zoom-in; }
.w-card-photo img { width: 100%; aspect-ratio: var(--ar, 3 / 2); object-fit: cover; object-position: var(--pos, 50% 50%); }
.w-nophoto { display: flex; align-items: center; justify-content: center; aspect-ratio: 3 / 2; padding: 16px; background: var(--land-o); color: var(--muted); text-align: center; font-size: 14px; }
.w-card-body { padding: 18px 22px 22px; display: flex; flex-direction: column; gap: 6px; }
.w-card h3 { font-size: clamp(26px, 4vw, 32px); }
.w-alt, .w-sci { font-size: 14px; color: var(--muted); }
.w-why { margin-top: 4px; }
.w-meets { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.w-meet { padding-top: 10px; border-top: 1px solid var(--line); font-size: 15px; }
.w-meet-top { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
/* an encounter's where and when, folded under its place: the arrow at the right turns when it opens */
.w-more > summary { display: flex; align-items: center; gap: 12px; min-height: 44px; list-style: none; cursor: pointer; }
.w-more > summary::-webkit-details-marker { display: none; }
.w-more > summary::after { content: ''; flex: none; margin: 0 6px 0 auto; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform .2s; }
.w-more[open] > summary::after { transform: rotate(-135deg); }
.w-more > p { margin-top: 4px; }
.w-chance { font-size: 14px; }
.w-addbox { margin-top: 10px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; font-size: 15px; }

/* Gallery: tiles */
.w-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(46%, 220px), 1fr)); gap: 14px; margin-top: 14px; }
.w-tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.w-tile-photo img, .w-tile .w-nophoto { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
/* a tile's photo comes a little closer under the mouse (finishing touches, finding 7) */
.w-tile-photo { overflow: hidden; }
@media (hover: hover) {
  .w-tile-photo img { transition: transform .4s ease-out, opacity .4s ease-out; }
  .w-tile:hover .w-tile-photo img { transform: scale(1.04); }
}
.w-tile-name { display: flex; flex-direction: column; width: 100%; padding: 10px 12px 12px; border: 0; background: none; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
.w-tile-name i { font-size: 13px; color: var(--muted); }
.w-legend-tile { border-style: dashed; }
/* Po kolei · Mozaika (22.10.2026): one by one, the cards of On your route without their places; a mosaic, the tiles */
.w-mode { display: flex; align-items: center; margin-top: 12px; font: 500 13px var(--mono); letter-spacing: 0.06em; color: var(--muted); }
.w-mode button { min-height: 44px; padding: 0 10px; border: 0; background: none; color: inherit; font: inherit; letter-spacing: inherit; cursor: pointer; }
.w-mode button:first-child { padding-left: 0; }
.w-mode button[aria-pressed="true"] { color: var(--ink); text-decoration: underline 2px var(--accent); text-underline-offset: 5px; }
.w-big .w-nophoto { aspect-ratio: 3 / 2; }

/* Field guide */
.w-place:focus, .w-card:focus { outline: none; }
.w-place { margin-top: 26px; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; scroll-margin-top: 16px; }
.w-place-h { display: flex; flex-direction: column; gap: 4px; }
.w-place h3 { font-size: 26px; }
.w-rows { margin-top: 12px; display: flex; flex-direction: column; }
/* a row: its thumbnail (96 px, 4:3; the photo viewer on a click), the name, how and when, the chance; on a phone the
   thumbnail on the left of the rest */
.w-row { display: grid; grid-template-columns: 96px minmax(0, 1.1fr) minmax(0, 2fr) auto; gap: 4px 16px; padding: 12px 0; border-top: 1px solid var(--line); font-size: 15px; }
.w-row.w-note { grid-template-columns: 1fr; color: var(--muted); }
.w-row.w-note.w-note-pic { grid-template-columns: 96px minmax(0, 1fr); }   /* a note with its photo (20.10.2026) */
.w-row-photo { width: 96px; border-radius: 6px; overflow: hidden; }
.w-row-photo img { width: 96px; aspect-ratio: 4 / 3; object-fit: cover; transition: transform .3s; }
.w-row-photo:hover img { transform: scale(1.06); }
@media (max-width: 640px) {
  .w-row { grid-template-columns: 80px minmax(0, 1fr); }
  .w-row > .w-row-photo { grid-row: 1 / span 3; width: 80px; }
  .w-row > .w-row-photo img { width: 80px; }
  .w-row > :not(.w-row-photo) { grid-column: 2; }
  .w-row.w-row-nopic { grid-template-columns: 1fr; }
  .w-row.w-row-nopic > .w-row-photo { display: none; }
  .w-row.w-row-nopic > :not(.w-row-photo) { grid-column: 1; }
  .w-row.w-note { grid-template-columns: 1fr; }   /* a note without a photo: no thumbnail's column, its text from the left */
  .w-row.w-note > p { grid-column: 1; }
  .w-row.w-note.w-note-pic { grid-template-columns: 80px minmax(0, 1fr); }
  .w-row.w-note.w-note-pic > p { grid-column: 2; }
}
.w-box { margin-top: 26px; padding: 16px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); }
.w-avoid { background: var(--wet-soft); border-color: transparent; }
.w-box h3 { font-size: 24px; }
.w-box ul { margin-top: 10px; padding-left: 20px; list-style: disc; display: flex; flex-direction: column; gap: 6px; }

/* The map beside the tabs (19.10.2026): the country with the trip, a dot at every place of the field guide in its colour, a
   ring for a place off the trip, and the points beyond Route G, grey and shown only while lit (wildapp.js). A lit place
   (class on) has its dot bigger, with a pulse around it, and its name; the other dots fade; the caption names the lit places.
   From 1101 px the map stands beside the tabs, sticky; below, a band over them: the map 180 px high on the left, the
   caption beside it. Its rules for the dots come from the map of the list of the places off the trip (template.html). */
.w-map { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 14px; margin: -8px 0 12px; padding: 6px 0;
  background: var(--paper); border-bottom: 1px solid var(--line); }
.w-map svg { display: block; height: 180px; width: auto; flex: none; overflow: visible; }
/* a place of the field guide or a card the page brings to the top (a link with #guide-<place>, a name in the guide) stands
   under the band, not behind it */
@media (max-width: 1100px) { .w-place, .w-card { scroll-margin-top: 210px; } }
.w-map-cap { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.w-map-names { display: flex; flex-direction: column; gap: 2px; font-weight: 600; font-size: 15px; line-height: 1.35; }
.w-map-names:empty { display: none; }
.w-map-name { display: flex; align-items: center; gap: 8px; animation: w-in .3s ease-out; }
.w-map-none { font-weight: 400; color: var(--muted); }
.w-map-key { font-size: 13px; color: var(--muted); }
.w-map .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
.w-map .dot.ring { background: var(--surface); box-shadow: inset 0 0 0 2px var(--c); }
@keyframes w-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (min-width: 1101px) {
  .w-main { display: grid; grid-template-columns: minmax(0, 780px) minmax(0, 1fr); gap: 40px; align-items: start; }
  .w-panels { grid-column: 1; grid-row: 1; }
  .w-map { grid-column: 2; grid-row: 1; top: 16px; display: block; margin: 0; padding: 0; background: none; border: 0; }
  /* the map and its caption fit above the footer, so at the end of a tab the map stays where it sticks with every lit dot on
     the screen (final review of the map, 19.10.2026): 16 px above the map, 10 px to the caption, the caption's room for five
     names and the key (Poza Route G, 136 px), the footer with the space above it (208 px); smaller only on a low window */
  .w-map svg { width: 100%; max-width: 340px; height: auto; max-height: calc(100vh - 370px); }
  .w-map-cap { margin-top: 10px; min-height: 136px; }
}
.bm-land { fill: var(--land); stroke: var(--border); stroke-width: 1; stroke-linejoin: round; }
.bm-road { stroke: var(--ink); stroke-width: 1.6; stroke-linecap: round; fill: none; opacity: 0.75; }
.bm-fly { stroke: var(--ink); stroke-width: 1.3; stroke-dasharray: 4 4; fill: none; opacity: 0.75; }
.bm-stay { fill: var(--ink); }
.bm-pt { cursor: pointer; }
.bm-pt .bm-dot { fill: var(--c); stroke: var(--surface); stroke-width: 2; transition: r .3s, opacity .3s; }
.bm-pt.ring .bm-dot { fill: var(--surface); stroke: var(--c); stroke-width: 3; }
.bm-pt .bm-halo { fill: var(--c); opacity: 0; }
.bm-hit { fill: transparent; }
.bm-pt.spot { pointer-events: none; }
.bm-pt.spot .bm-dot { opacity: 0; }
.bm-pt.spot.on .bm-dot { opacity: 1; }
/* the name: 14 px (BIG_NAME_PX in page.js), 14 px from the dot (BIG_NAME_GAP) */
.bm-pt text { font: 600 14px var(--body); fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; opacity: 0; transition: opacity .3s; pointer-events: none; }
.bm-pt.on .bm-dot { r: 9px; }
.bm-pt.on .bm-halo { animation: bm-pulse 1.6s ease-out infinite; }
.bm-pt.on text { opacity: 1; }
.w-map.any .bm-pt:not(.on) .bm-dot { opacity: 0.45; }
.w-map.any .bm-pt.spot:not(.on) .bm-dot { opacity: 0; }
@keyframes bm-pulse { 0% { r: 9px; opacity: 0.45; } 100% { r: 26px; opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .bm-pt.on .bm-halo { animation: none; r: 16px; opacity: 0.25; } .w-map-name { animation: none; } }
/* the band: the map drawn 180 px high, about 0.27 of its px, so its lines, dots and the place to tap one are drawn bigger
   in its px; the names stand beside the map */
@media (max-width: 1100px) {
  .bm-land { stroke-width: 3; }
  .bm-road { stroke-width: 5; }
  .bm-fly { stroke-width: 4.5; stroke-dasharray: 12 12; }
  .bm-stay { r: 8px; }
  .bm-pt .bm-dot { r: 15px; stroke-width: 5; }
  .bm-pt.ring .bm-dot { stroke-width: 8; }
  .bm-pt.on .bm-dot { r: 26px; }
  .bm-pt.on .bm-halo { animation-name: bm-pulse-band; }
  .bm-hit { r: 40px; }
  .bm-pt text { display: none; }
  @keyframes bm-pulse-band { 0% { r: 26px; opacity: 0.45; } 100% { r: 70px; opacity: 0; } }
}
@media (max-width: 1100px) and (prefers-reduced-motion: reduce) { .bm-pt.on .bm-halo { r: 44px; } }
/* the items a dot on the map frames: the cards, tiles and places of its place; those below the screen when a tab opens
   wait hidden (w-pre) and rise into place as they reach it (wildapp.js) */
.w-card, .w-tile, .w-place, .w-box { transition: opacity .5s ease-out, transform .5s ease-out, box-shadow .2s, border-color .2s; }
.w-pre { opacity: 0; transform: translateY(28px); }
.w-lit { border-color: var(--ink) !important; box-shadow: 0 0 0 1px var(--ink); }

/* the finishing touches (notes/plans/2026-10-20-wykonczenia-projekt.md): the motion starts with the class live on <html>,
   which wildapp.js sets on the first call of an IntersectionObserver; without it (no JavaScript, an old browser) all stands
   still. The
   photo at the top zooms slowly, once (finding 5); a photo loaded late waits unseen in its frame, which shows the photo's
   mean colour, and comes in once loaded (class in, finding 6) */
.live .w-hero > img { animation: kb 24s ease-out forwards; }
@keyframes kb { from { transform: none; } to { transform: scale(1.08); } }
img.ph { transition: opacity .4s ease-out; }
@media screen { .live img.ph:not(.in) { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .live .w-hero > img { animation: none; } }

/* the photo viewer */
.w-viewer { width: min(940px, 100vw - 24px); max-height: calc(100vh - 24px); padding: 0; border: 0; border-radius: 10px; background: var(--surface); color: var(--ink); }
.w-viewer::backdrop { background: rgba(var(--scrim), 0.82); }
.w-viewer img { width: 100%; max-height: 70vh; object-fit: contain; background: var(--photo-bg); }
/* the album (finishing touches, finding 7): ‹ › over the photo, the counter in its corner */
.wv-stage { position: relative; }
.wv-nav { position: absolute; top: 50%; transform: translateY(-50%); display: flex; align-items: center; justify-content: center; min-width: 44px; min-height: 44px; border: 0; border-radius: 22px; background: var(--ctl-bg); color: var(--ctl-ink); cursor: pointer; }
.wv-nav:disabled { opacity: 0.35; cursor: default; }
.wv-prev { left: 10px; }
.wv-next { right: 10px; }
.wv-count { position: absolute; top: 12px; left: 12px; padding: 2px 9px; border-radius: 999px; background: var(--badge-bg); color: var(--on-photo); font: 500 12px var(--mono); }
.wv-text { padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 6px; }
.wv-text h2 { font-size: 26px; padding-right: 50px; }
.wv-sci, .wv-cap { font-size: 14px; color: var(--muted); }
.wv-close { position: absolute; top: 8px; right: 8px; min-width: 44px; min-height: 44px; border: 0; border-radius: 22px; background: var(--ctl-bg); color: var(--ctl-ink); font-size: 22px; cursor: pointer; }

footer { border-top: 1px solid var(--line); background: var(--surface); padding-block: 22px 32px; font-size: 14px; color: var(--muted); }
footer summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; color: var(--ink); }
footer ul { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
footer p { margin-top: 8px; }
.noscript { padding: 16px var(--gutter); }
@page { size: A4; margin: 12mm; }
@media print {
  .w-tabs, .w-mode, .lang-switch, #w-back, .w-addbox, .w-drops, .w-add, .w-viewer, .w-hero > img, .w-hero::after, .w-where { display: none !important; }
  .w-hero { background: none; }
  .w-hero-in { min-height: 0; padding-block: 0 4mm; color: var(--ink); text-shadow: none; }
  .w-pre { opacity: 1 !important; transform: none !important; }
  .w-more > summary::after { display: none; }
  /* on paper two cards a row, as before the big photos */
  .w-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
  /* the map once, before the open tab, with every place of the field guide named on it (wildapp.js lights them all) */
  .w-main { display: block; }
  .w-map { position: static; display: flex; align-items: flex-start; gap: 6mm; margin: 0 0 6mm; padding: 0; border: 0; background: none; break-inside: avoid; }
  .w-map svg { width: 70mm; max-width: none; height: auto; max-height: none; }
  .w-map-cap { margin: 0; }
  .w-map-names { display: none; }
  .bm-pt .bm-dot, .bm-pt.on .bm-dot { r: 6px; stroke-width: 2; }
  .bm-pt.ring .bm-dot { stroke-width: 3; }
  .bm-pt .bm-halo { display: none; }
  .bm-pt text { display: inline; }
  .bm-land { stroke-width: 1; }
  .bm-road { stroke-width: 1.6; }
  .bm-fly { stroke-width: 1.3; stroke-dasharray: 4 4; }
  .bm-stay { r: 3px; }
}
</style>
</head>
<body>
<noscript><p class="noscript" lang="en">This page plans your route in the browser and needs JavaScript: turn it on in your browser’s settings.</p><p class="noscript" lang="pl">Ta strona układa trasę w przeglądarce i potrzebuje JavaScriptu: włącz go w ustawieniach przeglądarki.</p></noscript>
<header class="w-head">
  <div class="w-hero">
    <img id="w-hero-img" src="../img/wild/duk.jpg" srcset="../img/wild/duk-480.jpg 480w, ../img/wild/duk-960.jpg 960w, ../img/wild/duk-1400.jpg 1400w, ../img/wild/duk.jpg 1920w" sizes="(max-width: 700px) 200vw, 100vw" alt="" width="1920" height="1920" fetchpriority="high">
    <span class="w-where">Sơn Trà, Đà Nẵng</span>
    <div class="wrap w-hero-in">
      <div class="w-top"><a id="w-back" href="../"></a>
        <div class="lang-switch" id="lang-switch" role="group" data-i18n-aria="lang.aria"><button type="button" data-lang="en" lang="en" aria-pressed="false">EN</button><span aria-hidden="true">·</span><button type="button" data-lang="pl" lang="pl" aria-pressed="false">PL</button></div>
      </div>
      <div><p class="w-eyebrow" data-i18n="w.eyebrow"></p>
        <h1 data-i18n="w.h1"></h1>
        <p class="w-lead" data-i18n="w.lead"></p></div>
    </div>
  </div>
  <div class="wrap">
    <nav class="w-tabs" data-i18n-aria="w.tabs.aria"><a id="tab-route" href="#route" data-i18n="w.tab.route"></a><a id="tab-gallery" href="#gallery" data-i18n="w.tab.gallery"></a><a id="tab-guide" href="#guide" data-i18n="w.tab.guide"></a></nav>
  </div>
</header>
<main class="wrap w-main">
  <div class="w-map" id="w-map" aria-hidden="true"></div>
  <div class="w-panels">
    <section id="p-route" hidden></section>
    <section id="p-gallery" hidden></section>
    <section id="p-guide" hidden></section>
  </div>
</main>
<footer>
  <div class="wrap">
    <details><summary id="w-credits-h"></summary><ul id="w-credits"></ul></details>
    <p data-i18n="w.credits.note"></p>
    <p data-i18n="ft.copy"></p>
  </div>
</footer>
<dialog class="w-viewer" id="w-viewer">
  <div class="wv-stage"><div id="wv-photo"></div>
    <button type="button" class="wv-nav wv-prev" id="wv-prev" data-i18n-aria="g.prev"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M15 5l-7 7 7 7"/></svg></button>
    <button type="button" class="wv-nav wv-next" id="wv-next" data-i18n-aria="g.next"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg></button>
    <span class="wv-count" id="wv-count"></span></div>
  <div class="wv-text"><h2 id="wv-name"></h2><p class="wv-sci" id="wv-sci"></p><p id="wv-why"></p><p class="wv-cap" id="wv-cap"></p></div>
  <button type="button" class="wv-close" id="wv-close" data-i18n-aria="w.close">×</button>
</dialog>
<script>
/* The places (modules) the engine plans with: only what the engine needs; the names, texts and photos are in the texts of
   the places (content.js, content/<id>.js). axis: position on the south–north line that trips sweep along, close to the latitude
   (Pù Luông sits before Ninh Bình so trips run Pù Luông → Ninh Bình → Cát Bà, and Cúc Phương between them; Sa Pa, at
   22.34° N, sits past Hà Giang so the north runs Ba Bể → Cao Bằng → Hà Giang → Sa Pa; Mù Cang Chải, at 21.85° N, sits past
   Sa Pa, the way down from Sa Pa to Hà Nội on road 32). nights: [min, ideal, max]; the
   minimum is 1 only where a one-night plan exists or the place is an airport's city (HUBS). level: the lowest
   adventure level the place is offered at (1 spokojnie, 2 aktywnie, 3 ekstremalnie). fit: 0–3 for each
   interest. node: the travel point it shares with another place (hanoiStop is a night in Hà Nội on the way,
   between two other places). */
var PLACES = {
  saigon:    { axis: 10.78, nights: [1, 2, 3], level: 1, fit: { kultura: 2, jedzenie: 3, przyroda: 1, gory: 0, morze: 0 } },
  mekong:    { axis: 10.03, nights: [1, 2, 2], level: 1, fit: { kultura: 1, jedzenie: 3, przyroda: 1, gory: 0, morze: 0 } },
  phuquoc:   { axis: 10.33, nights: [2, 3, 4], level: 1, fit: { kultura: 0, jedzenie: 1, przyroda: 1, gory: 0, morze: 3 } },
  cattien:   { axis: 11.43, nights: [1, 2, 2], level: 1, fit: { kultura: 0, jedzenie: 0, przyroda: 3, gory: 1, morze: 0 } },
  dalat:     { axis: 11.94, nights: [2, 3, 4], level: 1, fit: { kultura: 1, jedzenie: 1, przyroda: 2, gory: 2, morze: 0 } },
  hoian:     { axis: 15.88, nights: [1, 2, 3], level: 1, fit: { kultura: 3, jedzenie: 3, przyroda: 0, gory: 0, morze: 1 } },
  danang:    { axis: 16.07, nights: [1, 2, 2], level: 1, fit: { kultura: 1, jedzenie: 1, przyroda: 1, gory: 1, morze: 2 } },
  hue:       { axis: 16.46, nights: [2, 2, 3], level: 1, fit: { kultura: 3, jedzenie: 2, przyroda: 1, gory: 0, morze: 0 } },
  phongnha:  { axis: 17.6, nights: [2, 3, 4], level: 1, fit: { kultura: 0, jedzenie: 0, przyroda: 2, gory: 3, morze: 0 } },
  cucphuong: { axis: 20.25, nights: [1, 2, 2], level: 1, fit: { kultura: 0, jedzenie: 0, przyroda: 3, gory: 1, morze: 0 } },
  puluong:   { axis: 20.2, nights: [2, 2, 3], level: 1, fit: { kultura: 1, jedzenie: 0, przyroda: 2, gory: 2, morze: 0 } },
  ninhbinh:  { axis: 20.3, nights: [1, 2, 2], level: 1, fit: { kultura: 2, jedzenie: 0, przyroda: 2, gory: 1, morze: 0 } },
  catba:     { axis: 20.73, nights: [3, 3, 4], level: 1, fit: { kultura: 0, jedzenie: 1, przyroda: 2, gory: 1, morze: 2 } },

  'sw.note': 'Samodzielnie tylko z prawem jazdy na motocykl i międzynarodowym prawem jazdy według konwencji z 1968 r., oba przy sobie. Samo prawo jazdy na samochód nie wystarcza nawet na skuter 110–125 cm³. Sprawdź, według której konwencji wydaje je twój kraj, bo wzór z 1949 r. w Wietnamie nie działa. Wyjątki z umów: prawo jazdy z państwa ASEAN i międzynarodowe prawo jazdy z Korei Płd., choć policja przy kontroli może ich nie uznać od ręki.',
  'sw.req.h': 'Wymagania. ', 'sw.risk.h': 'Ryzyko. ', 'sw.tips.h': 'Rady. ',
  'sw.req': 'W motocyklu muszą być dowód rejestracyjny i polisa obowiązkowego OC, a kask zgodny z normą trzeba zapiąć, także pasażerowi. Sprawdź w warunkach swojej polisy, czy obejmuje jazdę motocyklem.',
  'sw.risk': 'Na drogach Wietnamu ginie ok. 17 000 osób rocznie (szacunek WHO). Ponad 90% zabitych w 2023 r. to ofiary wypadków z udziałem motocykla (dane krajowe). Po wypadku grozi odpowiedzialność karna, odszkodowanie i zakaz wyjazdu do końca dochodzenia. Bez uprawnień grozi mandat 2–4 mln VND i zatrzymanie motocykla, a polisa może nie zapłacić. Policja kontroluje cudzoziemców.',
  'sw.tips': 'Paszportu nie zostawiaj w zastaw, zapytaj o kaucję gotówką. Nie jedź po zmroku, w deszczu i mgle zwolnij, a na serpentynach uważaj na żwir i ciężarówki.',
  'sw.tips.caobang': 'Na pętli rozsądnie jest 80–100 km dziennie. Tankuj przy każdej okazji, bo za miastem stacji jest mało.',
  'sw.tips.hagiang': 'Motocykl weź i oddaj w mieście Hà Giang. Na pętli rozsądnie jest 100–150 km dziennie, więc ruszaj rano; najostrzejsze zakręty i najwięcej ciężarówek są na przełęczach Bắc Sum i Mã Pí Lèng. Đồng Văn, Mã Pí Lèng i Lũng Cú leżą w strefie przygranicznej: pozwolenie za ok. 230 000–300 000 VND wydaje urząd imigracyjny policji w mieście Hà Giang, a załatwia je też hotel. Nie zbaczaj w drogi ku granicy.',
  'sw.risk.hagiang': 'Od 12 kwietnia 2026 drogę do Đồng Văn sprawdza policja prowincji, zwłaszcza cudzoziemców na wypożyczonych motocyklach, a część wypożyczalni i biur (ok. 30) zobowiązała się nie wydawać motocykla bez wymaganych uprawnień. W 2026 na pętli zginęły dwie turystki, obie na tylnym siodełku motocykla miejscowego kierowcy.',
  'sw.tips.haivan': 'Przez przełęcz jedzie się tylko górą, bo motocykle nie wjeżdżają do tunelu. Wyjedź rano, przed ruchem i mgłą.',

  'sw.note': 'Ride yourself only with a motorbike licence and an International Driving Permit under the 1968 Convention, both on you. A car licence does not cover even a 110–125 cc scooter. Check which convention your country issues it under: a 1949 permit does not work in Vietnam. Exceptions by agreement: a licence from an ASEAN country and a South Korean permit, though police at a check may not accept them straight away.',

   geo/make_basemap.py reads it to cut the outline (OUTLINE in basemap.js). */

var MAP_PANELS = {
  north: { lon0: 103.45, lat0: 23.45, lon1: 107.6, lat1: 19.3, bar: 'left',

  centre: { lon0: 105.6, lat0: 18.4, lon1: 108.9, lat1: 15.1, bar: 'left',
    names: [['m.laos', 16.3, 106.3, 'country', 'middle'], ['m.sea', 17.6, 108.8, 'water', 'end']] },
  south: { lon0: 103.6, lat0: 13.3, lon1: 109.25, lat1: 9.6, bar: 'left',

/* Pure helpers of the page, shared with the tests: the settings link, the defaults, the day plans of a stay, the holiday
   warnings, the figures of a trip, the places off the trip and the travel texts. No DOM here.
   Calls engine.js (normSettings, isoDay); the data (places, holidays, airports, road texts) comes in through arguments. */
var SITE_URL = 'https://grzegorzfrskiba-hub.github.io/wietnam/';   // the public page: the copied plan links here

/* ---------- the settings link ---------- */
// the keys of a link (Polish, readable) and the settings field each fills; the order of the fields parseLink returns
var LINK_KEYS = { od: 'from', 'do': 'to', start: 'start', koniec: 'end', miesiac: 'month', dni: 'days', co: 'interests', poziom: 'level', dodaj: 'add', usun: 'remove',
  motocykl: 'moto' };
var SETTINGS_ORDER = ['from', 'to', 'start', 'end', 'year', 'month', 'days', 'interests', 'level', 'add', 'remove', 'moto'];

/* The settings in the part of the address after #:
   #od=SGN&do=HAN&miesiac=2027-02&dni=15&co=przyroda,gory&poziom=2&dodaj=phuquoc&usun=hoian&motocykl=caobang, or with dates
   #od=SGN&do=HAN&start=2027-02-01&koniec=2027-02-15&co=&poziom=2. Returns the well-formed fields typed for normSettings:
   from, to, start, end as texts; year, month, days, level as numbers; interests, add, remove, moto as lists (moto: the
   swaps set to „Samodzielnie”, SWAPS in content.js). A malformed field is
   left out, so the page uses its default; unknown keys (an anchor such as #day-5, or a name such as constructor) are ignored.
   A known key without = (a link cut short, as in #od=SGN&do) is a malformed field too.
   rejected, an optional array, gets the settings field name of each malformed field, once. */
function parseLink(hash, rejected) {
  var got = {}, out = {};
  function reject(field) { if (rejected && rejected.indexOf(field) < 0) rejected.push(field); }
  String(hash || '').replace(/^#/, '').split('&').forEach(function (part) {
    var i = part.indexOf('='), key = i < 0 ? part : part.slice(0, i), v, m, list;
    var field = LINK_KEYS.hasOwnProperty(key) ? LINK_KEYS[key] : null;   // no own key: an object property is no field
    if (!field) return;   // an anchor or an unknown key is not a link field
    if (i < 0) { reject(field); return; }
    try { v = decodeURIComponent(part.slice(i + 1)); } catch (e) { reject(field); return; }
    if (field === 'from' || field === 'to') { if (/^[A-Z]{3}$/.test(v)) got[field] = v; else reject(field); }
    else if (field === 'start' || field === 'end') { if (/^\d{4}-\d{2}-\d{2}$/.test(v)) got[field] = v; else reject(field); }
    else if (field === 'month') { if ((m = /^(\d{4})-(\d{2})$/.exec(v))) { got.year = +m[1]; got.month = +m[2]; } else reject(field); }
    else if (field === 'days') { if (/^\d{1,2}$/.test(v)) got.days = +v; else reject(field); }
    else if (field === 'level') { if (/^\d$/.test(v)) got.level = +v; else reject(field); }
    else {
      list = v === '' ? [] : v.split(',');
      if (list.every(function (x) { return (field === 'add' || field === 'remove' ? /^[A-Za-z]+$/ : /^[a-z]+$/).test(x); })) got[field] = list;
      else reject(field);
    }

/* The settings as the part of the address after # (parseLink reads it back). The interests are always written, also
   none (co=), so a link keeps meaning "no interest" if the defaults ever change; Dodaj, Usuń and the swaps only when there
   are any. */
function linkHash(s) {

  if (s.start) parts.push('start=' + s.start, 'koniec=' + s.end);
  else parts.push('miesiac=' + s.year + '-' + (s.month < 10 ? '0' : '') + s.month, 'dni=' + s.days);
  parts.push('co=' + (s.interests || []).join(','), 'poziom=' + s.level);
  if (s.add && s.add.length) parts.push('dodaj=' + s.add.join(','));
  if (s.remove && s.remove.length) parts.push('usun=' + s.remove.join(','));
  if (s.moto && s.moto.length) parts.push('motocykl=' + s.moto.join(','));
  return '#' + parts.join('&');
}

/* ---------- the language (stage 5) ---------- */
/* The page's language from the part of the address after #: Polish when the link says lang=pl, else English, the default
   (decision of 15.10.2026). The language is no setting of the trip: lang with another value, or without one, is English,
   with no warning of a wrong link, and parseLink leaves it out. */
function langOf(hash) { return /(?:^#?|&)lang=pl(?:&|$)/.test(String(hash || '')) ? 'pl' : 'en'; }
/* The estimated costs, shown or hidden (the first round of fixes, fix 2, 16.10.2026): shown only when the link says
   koszty=1; another value, or none, hides them, with no warning of a wrong link: the costs are no setting of the trip, as
   the language is not, and parseLink leaves them out. */
function costsOf(hash) { return /(?:^#?|&)koszty=1(?:&|$)/.test(String(hash || '')); }
/* The address of the settings in the page's view: koszty=1 when the costs show, then lang=pl at the end in Polish, so a
   link copied, sent or printed opens the same trip as its sender sees it; English and hidden costs add nothing, so every
   link from before opens in English with the costs hidden. */
function pageHash(s, lang, costs) { return linkHash(s) + (costs ? '&koszty=1' : '') + (lang === 'pl' ? '&lang=pl' : ''); }
/* The texts of the places in a language. content: CONTENT, with the Polish texts; overlay: for English CONTENT_EN, the same
   fields where a place has a text (tests/content.test.js checks it), lists in the same order. Returns a copy of content
   with the overlay's texts over the Polish ones and the data (p, pace, cost…) as it was; without an overlay, content. */
function localContent(content, overlay) {
  function over(base, o) {

    if (typeof base === 'string') return o;
    if (Array.isArray(base)) return base.map(function (b, i) { return over(b, o[i]); });
    if (base && typeof base === 'object') { var out = {}; Object.keys(base).forEach(function (k) { out[k] = over(base[k], o[k]); }); return out; }

  var out = {};
  Object.keys(content).forEach(function (id) { out[id] = over(content[id], overlay[id]); });

}

/* The trip as the folded rows of „Dzień po dniu” see it (the first round of fixes, 16.10.2026): its stays, each with its first
   day and nights, and its days. A new rendering of the same trip (a change of the language, a swap) keeps the open days and
   journeys open; on another trip they close, as its days are others. route: planRoute's trip. */
function tripKey(route) { return route.stops.map(function (s) { return s.id + ' ' + s.start + ' ' + s.n; }).join(', ') + ' / ' + route.days; }

/* A copy of the settings with lists of its own; add, remove and moto are never missing. */
function copySettings(s) {
  var o = {};
  Object.keys(s).forEach(function (k) { o[k] = Array.isArray(s[k]) ? s[k].slice() : s[k]; });
  o.add = o.add || [];
  o.remove = o.remove || [];
  o.moto = o.moto || [];
  return o;
}

// the settings fields behind each error of normSettings
var ERROR_FIELDS = { airport: ['from', 'to'], date: ['start', 'end'], month: ['year', 'month'], year: ['year'], days: ['days', 'start', 'end'],
  interests: ['interests'], level: ['level'], add: ['add'], remove: ['remove'] };

/* The settings a link opens: its fields over the defaults, checked with normSettings. A field the engine refuses goes back
   to its default (an airport only when it is no known one), one error at a time, until the settings pass. Places with a
   node (a night on the way) are taken out of add and remove: the page has no buttons for them. Unknown or refused values
   in interests, add and remove are dropped too, and their field is reported in dropped. The settings keep only the fields
   of their term: with dates no month, year or days, without dates no start or end; such a field from the link is reported.
   The swaps (moto) keep the ids of swaps (SWAPS) only, each once; an unknown one is dropped and reported.
   Returns { settings, st, dropped }: the settings to show, normSettings' result, and the link fields not used.
   The optional rejected (the malformed fields from parseLink) starts dropped, so they are reported too. */
function settingsFromLink(link, defaults, places, hubs, rejected, swaps) {
  var s = copySettings(defaults), dropped = rejected ? rejected.slice() : [];
  Object.keys(link).forEach(function (k) { s[k] = Array.isArray(link[k]) ? link[k].slice() : link[k]; });
  ['add', 'remove'].forEach(function (k) { s[k] = s[k].filter(function (id) { return !(places[id] && places[id].node); }); });
  for (var tries = 0; tries < 12; tries++) {
    var st = normSettings(s, places, hubs), fields;
    if (st.ok) {

      ['interests', 'add', 'remove'].forEach(function (k) {
        if (k in link && dropped.indexOf(k) < 0 && s[k].some(function (v) { return st[k].indexOf(v) < 0; })) dropped.push(k);
        s[k] = st[k].slice();
      });
      (st.start ? ['year', 'month', 'days'] : ['start', 'end']).forEach(function (k) {
        if (k in link && dropped.indexOf(k) < 0) dropped.push(k);
        delete s[k];
      });
      var moto = s.moto.filter(function (id, i) { return swaps && swaps.hasOwnProperty(id) && s.moto.indexOf(id) === i; });
      if (moto.length !== s.moto.length && dropped.indexOf('moto') < 0) dropped.push('moto');
      s.moto = moto;
      return { settings: s, st: st, dropped: dropped };
    }
    fields = ERROR_FIELDS[st.error];
    if (st.error === 'airport') fields = fields.filter(function (k) { return !(typeof s[k] === 'string' && hubs.hasOwnProperty(s[k])); });
    fields.forEach(function (k) {
      if (k in link && dropped.indexOf(k) < 0) dropped.push(k);
      if (k in defaults) s[k] = Array.isArray(defaults[k]) ? defaults[k].slice() : defaults[k];
      else delete s[k];

}

/* The settings without a link: Hồ Chí Minh City → Hà Nội, 15 days, no interest, level 2, in the best of the 12 months
   after today's: the month whose trip scores highest; a tie goes to the month with fewer holidays (tripAlerts), then to
   the earlier one. today: YYYY-MM-DD; data: planRoute's data; holidays: { list, from, until, tetMargin } for tripAlerts. */
function defaultSettings(today, data, holidays) {
  var y = +today.slice(0, 4), m = +today.slice(5, 7), best = null;
  for (var k = 1; k <= 12; k++) {
    var mm = m + k, yy = y;
    while (mm > 12) { mm -= 12; yy++; }
    var s = { from: 'SGN', to: 'HAN', year: yy, month: mm, days: 15, interests: [], level: 2, add: [], remove: [], moto: [] };
    var st = normSettings(s, data.places, data.hubs), r = planRoute(st, data);
    if (!r.ok) continue;
    var hol = tripAlerts(st, holidays.list, holidays.from, holidays.until, holidays.tetMargin).hits.length;
    if (!best || r.score > best.score + 1e-9 || (Math.abs(r.score - best.score) <= 1e-9 && hol < best.hol)) best = { s: s, score: r.score, hol: hol };
  }
  if (!best) throw new Error('defaultSettings: no month gives a trip');
  return best.s;
}

/* Today (YYYY-MM-DD) held inside the days the page plans for: not before fromISO and not after December 1 of lastYear. A
   wrong device clock then still gives defaults the engine accepts and a short list of months. */
function clampToday(todayISO, fromISO, lastYear) {
  var last = lastYear + '-12-01';
  return todayISO < fromISO ? fromISO : todayISO > last ? last : todayISO;
}

/* The months the page offers, [{ year, month }]: from this month to December of lastYear, and always a year ahead. */
function monthChoices(today, lastYear) {
  var y = +today.slice(0, 4), m = +today.slice(5, 7), end = Math.max(lastYear, y + 1), out = [];
  while (y <= end) {
    out.push({ year: y, month: m });
    if (++m > 12) { m = 1; y++; }
  }
  return out;
}

/* ---------- day plans ---------- */
/* One day at an adventure level: with self (the place's swap set to „Samodzielnie”) the self version, at every level;
   else level 1 takes the easy version, level 3 the hard one unless month (1–12) is one of its months off, or unless it is
   late (its night ends away from the stay) and notLate is true; otherwise the usual day. A version keeps the day's early
   start unless it sets its own, and the day's rain plan; its cost and pack, see content.js.

function variantOf(day, level, month, notLate, self) {
  var hard = level === 3 && day.hard && (day.hard.off || []).indexOf(month) < 0 && !(notLate && day.hard.late);
  var v = self && day.self ? 'self' : level === 1 && day.easy ? 'easy' : hard ? 'hard' : null;
  var src = v ? day[v] : day;
  return { pace: src.pace, t: src.t, d: src.d, early: !!(src.early != null ? src.early : day.early), rain: (v === 'hard' && day.hard.rain ? day.hard.rain : day.rain) || null, variant: v,
    cost: (src.cost || day.cost || []).slice(), pack: (src.pack || day.pack || []).slice() };
}
// a plan that has no versions: the solo plan of one night, the arrival day of a second stay, the second day of a two-day
// hard version (variant 'hard')
function plainDay(x, variant) {
  return { pace: x.pace, t: x.t, d: x.d, early: !!x.early, rain: null, variant: variant || null, cost: (x.cost || []).slice(), pack: (x.pack || []).slice() };
}

/* The day plans of one stay: [{ day, pace, t, d, early, rain, variant, cost, pack, plan }], one per night, from the stay's first day;
   plan: { p, v }, the plan of the place's texts the day comes from and its version ('' the usual one, 'easy', 'hard', 'self',
   'solo', or 'again' with p 0), which the wildlife subpage reads to say whether an encounter is in the day's plan (stage 6).
   c: the place's content; stop: { n, start } from planRoute; done: nights spent there earlier in the trip (on a round trip
   the airport's city comes back at the end); level: 1–3; months: st.months, the month (0–11) of each trip day.
   A first stay takes the n plans with the lowest p, in their order o; a one-night stay the solo version of the p 1 plan
   when it has one. A second stay starts with c.again and goes on with the next plans by p (after a solo night, with the
   plans after those its covers stands for). null when there are too few.
   next: the leg after the stay, { home, h, ferry } (the way home or not, its hours, to a place behind a ferry or not; see
   legAfter), or none: no restriction. On the stay's last day, when the way home, a leg of LONG_LEG_H hours or more or a
   journey to a place behind a ferry follows, a late hard version (its next morning goes on the walk out, so the journey
   would start around noon and reach the river after the last crossing) gives way to the usual day.
   self: the place's swap is set to „Samodzielnie”, so the days with a self version take it (selfSwaps).
   A hard version with next spans two days: its night is away (late) and the next day of the stay becomes next, the trip's
   second day, whatever plan stood there. Both or neither: it is taken only when the stay has a next day, and the month of
   its first day decides, as a trip is booked by the day it starts. */

  var byP = c.days.slice().sort(function (a, b) { return a.p - b.p; }), out = [], picked;
  var notLate = !!next && (next.home || next.h >= LONG_LEG_H || !!next.ferry);
  if (done) {
    if (!c.again) return null;
    // after a one-night first stay, whose solo plan may stand for more plans than the p 1 one (its covers)
    var from = done === 1 && byP[0].solo && byP[0].solo.covers ? byP[0].solo.covers : done;
    picked = byP.slice(from, from + stop.n - 1);
    if (picked.length !== stop.n - 1) return null;
    out.push(plainDay(c.again));
    out[0].plan = { p: 0, v: 'again' };
  } else {
    picked = byP.slice(0, stop.n);
    if (picked.length !== stop.n) return null;
  }
  var second = null;   // the second day of a two-day hard version taken the day before
  picked.sort(function (a, b) { return a.o - b.o; }).forEach(function (d) {
    var k = stop.start - 1 + out.length, last = out.length === stop.n - 1, two = d.hard && d.hard.next;
    if (second) { out.push(second); second = null; return; }
    if (stop.n === 1 && d.solo) { out.push(plainDay(d.solo)); out[out.length - 1].plan = { p: d.p, v: 'solo' }; return; }
    // a late hard version stays off the last day before a long leg, and a two-day one off the last day of any stay
    var away = last && (notLate || !!two);
    var v = variantOf(d, level, months[k] + 1, away, self);
    v.plan = { p: d.p, v: v.variant || '' };
    if (two && v.variant === 'hard') { second = plainDay(d.hard.next, 'hard'); second.plan = { p: d.p, v: 'hard' }; }
    out.push(v);
  });
  out.forEach(function (d, k) { d.day = stop.start + k; });
  return out;
}

/* ---------- dates and holidays ---------- */
/* Calendar date of trip day n (1-based) as YYYY-MM-DD, or null while no start date is set. UTC avoids time-zone shifts. */
function tripDate(startISO, day) {
  if (!startISO) return null;
  var p = startISO.split('-').map(Number);
  return new Date(Date.UTC(p[0], p[1] - 1, p[2] + day - 1)).toISOString().slice(0, 10);
}

/* First and last day of the trip, YYYY-MM-DD: with dates the trip itself, in the month mode the whole month;
   null in the month mode without a year. */
function tripSpan(st) {
  if (st.start) return [st.start, tripDate(st.start, st.days)];
  if (!st.year) return null;
  var mm = (st.month < 10 ? '0' : '') + st.month, last = new Date(Date.UTC(st.year, st.month, 0)).getUTCDate();
  return [st.year + '-' + mm + '-01', st.year + '-' + mm + '-' + last];
}

/* Whether the term is over: the trip's last day (tripSpan: the month's last day in the month mode, the end date with dates)
   is before todayISO (YYYY-MM-DD). False without a span (a month without a year). */
function termPassed(st, todayISO) {
  var span = tripSpan(st);
  return !!span && span[1] < todayISO;
}

/* The holidays that touch the trip: rows [first, last, kind, name] of list (HOLIDAYS) that overlap tripSpan, Tết from
   tetMargin days before its days off to tetMargin days after. unknown: the trip runs outside from…until, the days the
   list covers, or has no year. Returns { hits: [{ from, to, kind, name }], unknown }. */
function tripAlerts(st, list, from, until, tetMargin) {
  var span = tripSpan(st);
  if (!span) return { hits: [], unknown: true };
  var a = isoDay(span[0]), b = isoDay(span[1]);
  var hits = list.filter(function (h) {
    var m = h[2] === 'tet' ? tetMargin : 0;
    return isoDay(h[0]) - m <= b && isoDay(h[1]) + m >= a;
  }).map(function (h) { return { from: h[0], to: h[1], kind: h[2], name: h[3] }; });
  return { hits: hits, unknown: span[0] < from || span[1] > until };
}

/* Days for a sentence: '6–12.02.2027', '30.04–3.05.2027', '28.12.2030–2.01.2031'; one day: '1.01.2027'. In English (stage 5),
   with mon the 12 short names of the months (UI.en mon3.1…12): '6–12 Feb 2027', '30 Apr – 3 May 2027',
   '28 Dec 2030 – 2 Jan 2031', '1 Jan 2027'. */
function fmtSpan(a, b, mon) {
  var p = a.split('-'), q = b.split('-');
  if (mon) {
    var md = function (x) { return +x[2] + ' ' + mon[+x[1] - 1]; };
    if (a === b) return md(p) + ' ' + p[0];
    if (p[0] !== q[0]) return md(p) + ' ' + p[0] + ' – ' + md(q) + ' ' + q[0];
    if (p[1] !== q[1]) return md(p) + ' – ' + md(q) + ' ' + q[0];
    return +p[2] + '–' + md(q) + ' ' + q[0];
  }
  function dm(x) { return +x[2] + '.' + x[1]; }
  if (a === b) return dm(p) + '.' + p[0];
  if (p[0] !== q[0]) return dm(p) + '.' + p[0] + '–' + dm(q) + '.' + q[0];
  if (p[1] !== q[1]) return dm(p) + '–' + dm(q) + '.' + q[0];
  return +p[2] + '–' + dm(q) + '.' + q[0];
}

/* ---------- weather, events and the season of an interest ---------- */
var RAIN_PLAN_DAYS = 10;   // a day's rain plan shows in a month with this many days of rain or more (climate.js, as the page rounds it)

/* The weather of one stay, month by month: [{ month: 1–12, season: 'D'|'S'|'Z'|'X', t: [min, max], mm, days, why: [codes] }],
   one entry for each month the stay's days (start…end) fall in, in order, the numbers rounded as the page shows them.
   stop: { id, start, n }; months: st.months (0–11 for each trip day); climate: CLIMATE; seasons: SEASONS. */
function stayWeather(stop, months, climate, seasons) {
  var c = climate[stop.id], out = [];
  for (var d = stop.start; d < stop.start + stop.n; d++) {
    var m = months[d - 1] + 1;
    if (out.length && out[out.length - 1].month === m) continue;
    out.push({ month: m, season: seasons[stop.id].charAt(m - 1), t: [Math.round(c.t[m - 1][0]), Math.round(c.t[m - 1][1])],
      mm: Math.round(c.rain[m - 1][0]), days: Math.round(c.rain[m - 1][1]), why: (c.why[m] || []).slice() });
  }
  return out;
}

/* Whether a day's rain plan shows: in month (1–12) the place has RAIN_PLAN_DAYS days of rain or more. placeClimate: CLIMATE[id]. */
function rainyMonth(placeClimate, month) { return Math.round(placeClimate.rain[month - 1][1]) >= RAIN_PLAN_DAYS; }

/* The events and seasonal notes of a place that a stay meets: the entries of c.events ({ from, to, t, warn }; from and to
   as [month, day], every year, and a window may run over the new year) that touch the stay's days (start…end). With dates
   the days themselves count; in the month mode, as for the holidays, the whole month of the trip.
   c: the place's content; stop: { start, n }; st: normSettings' result. */
function stayEvents(c, stop, st) {
  var days = [], d, iso;   // each day as month × 100 + day
  if (st.start) for (d = stop.start; d < stop.start + stop.n; d++) { iso = tripDate(st.start, d); days.push(+iso.slice(5, 7) * 100 + +iso.slice(8)); }
  else for (d = 1; d <= 31; d++) days.push(st.month * 100 + d);
  return (c.events || []).filter(function (e) {
    var a = e.from[0] * 100 + e.from[1], b = e.to[0] * 100 + e.to[1];
    return days.some(function (x) { return a <= b ? x >= a && x <= b : x >= a || x <= b; });
  });
}

/* The chosen interests that the trip serves badly. For each chosen interest, the stays that serve it (fit 2 or more; a
   night on the way does not count): when there is none, { interest, none: true }; when each of them has only poor nights
   (Z), { interest, ids: their places, each once, why: the reasons of those months, each once, months: those months (1–12),
   each once, in order }. Otherwise nothing. route: planRoute's trip; st: normSettings' result; climate: CLIMATE. */
function interestAlerts(route, st, places, climate) {
  var out = [];
  st.interests.forEach(function (k) {
    var serving = route.stops.filter(function (s) { return !places[s.id].node && (places[s.id].fit[k] || 0) >= 2; });
    if (!serving.length) { out.push({ interest: k, none: true }); return; }
    if (!serving.every(function (s) { return /^Z+$/.test(s.season); })) return;
    var a = { interest: k, ids: [], why: [], months: [] };
    serving.forEach(function (s) {
      if (a.ids.indexOf(s.id) < 0) a.ids.push(s.id);
      for (var d = s.start; d < s.start + s.n; d++) {
        var m = st.months[d - 1] + 1;
        if (a.months.indexOf(m) < 0) a.months.push(m);
        (climate[s.id].why[m] || []).forEach(function (w) { if (a.why.indexOf(w) < 0) a.why.push(w); });
      }
    });
    out.push(a);
  });
  return out;
}

/* ---------- the trip ---------- */
/* The leg after stay i of a trip, as stopDays wants it (its next): { home, h, ferry }, h the hours of the journey, ferry
   true when it leads to a place behind a ferry, whose last crossing is in the evening. A stop's leg in planRoute leads
   into it, so the leg after a stay is the next stop's; after the last stay it is the way home. ferry: FERRY (content.js),
   or none: no journey is behind a ferry. */
function legAfter(route, i, ferry) {
  var last = i === route.stops.length - 1, leg = last ? route.home : route.stops[i + 1].leg;
  return { home: last, h: leg.total, ferry: !last && !!ferry && !!ferry[route.stops[i + 1].id] };
}

/* The figures of the facts row: places (each once, nights on the way not counted), domestic flights, hiking days at the
   chosen level, the longest travel day and all hours on the road, the way to the departure airport included.
   route: planRoute's trip; plans: stopDays of each stay; places: PLACES. */
function routeStats(route, plans, places) {
  var seen = {}, out = { places: 0, flights: 0, hikes: 0, longest: 0, road: 0 };
  route.stops.forEach(function (s) { if (!places[s.id].node && !seen[s.id]) { seen[s.id] = true; out.places++; } });
  route.stops.map(function (s) { return s.leg; }).concat([route.home]).forEach(function (L) {
    out.flights += L.flights;
    out.road += L.total;
    out.longest = Math.max(out.longest, L.total);
  });
  plans.forEach(function (days) { days.forEach(function (d) { if (d.pace === 'hike') out.hikes++; }); });
  return out;
}

/* The places that left the trip when Dodaj changed it, in the order of the old trip, for the sentence after Dodaj: on the
   old trip, not on the new one. before, after: the stops of the two trips ({ id }); places: PLACES. A night on the way
   is no place to report, and a city twice on a round trip counts once. */
function droppedPlaces(before, after, places) {
  var now = {}, seen = {}, out = [];
  after.forEach(function (s) { now[s.id] = true; });
  before.forEach(function (s) {
    if (places[s.id].node || now[s.id] || seen[s.id]) return;
    seen[s.id] = true;
    out.push(s.id);
  });
  return out;
}

/* The places that stay on the trip after Dodaj, but with fewer nights, in the order of the old trip: the nights of a place
   are summed (a city twice on a round trip), and a night on the way is no place to report. before, after: the stops of
   the two trips ({ id, n }); places: PLACES. */
function shortenedPlaces(before, after, places) {
  function nights(stops) { var o = {}; stops.forEach(function (s) { if (!places[s.id].node) o[s.id] = (o[s.id] || 0) + s.n; }); return o; }
  var a = nights(before), b = nights(after), seen = {};
  return before.filter(function (s) {
    if (places[s.id].node || seen[s.id] || !(s.id in b) || b[s.id] >= a[s.id]) return false;
    seen[s.id] = true;
    return true;
  }).map(function (s) { return s.id; });
}

/* ---------- why a place is on the trip or not ---------- */
/* Why stay i of the trip is on it, for "Wybrane, bo…". A night on the way: { night: [the place before, the place after] }.
   Otherwise { added, airport, interests, way, months }: added: Dodaj asked for it; airport: 'from' when it opens the trip
   as the city of the arrival airport, 'to' when it closes the trip as the city of the departure airport, else null;
   interests: the chosen interests it serves (fit 2 or more), or, with none chosen, its two strongest of fit 2 or more
   (by fit, then in the order of INTERESTS); way: interests are chosen, it serves none and is no airport's city (it fills
   the days on the way); months: [{ month: 1–12, season }] of its days, each month once, in order.
   route: planRoute's trip; st: normSettings' result; hubs: HUBS. */
function whyOn(route, i, st, places, hubs) {
  var s = route.stops[i], p = places[s.id], last = route.stops.length - 1, months = [];
  if (p.node) return { night: [route.stops[i - 1].id, route.stops[i + 1].id] };
  var chosen = st.interests.filter(function (k) { return (p.fit[k] || 0) >= 2; });
  var strongest = INTERESTS.filter(function (k) { return (p.fit[k] || 0) >= 2; })
    .sort(function (a, b) { return p.fit[b] - p.fit[a] || INTERESTS.indexOf(a) - INTERESTS.indexOf(b); }).slice(0, 2);
  var airport = i === 0 && s.id === hubs[st.from] ? 'from' : i === last && s.id === hubs[st.to] ? 'to' : null;
  for (var d = s.start; d < s.start + s.n; d++) {
    var m = st.months[d - 1] + 1;
    if (!months.length || months[months.length - 1].month !== m) months.push({ month: m, season: s.season.charAt(d - s.start) });
  }
  return { added: st.add.indexOf(s.id) > -1, airport: airport, interests: st.interests.length ? chosen : strongest,
    way: st.interests.length > 0 && !chosen.length && !airport, months: months };
}

/* Why each place off the trip is not on it, south to north: every place without a node that is no stay of the trip.
   reasons, each one that holds, in this order: 'removed' (Usuń took it off); 'level' (it needs a higher level); 'closed'
   (closed, X, in every month of the trip); 'season' (poor, Z, in every month of the trip); 'profile' (interests are chosen
   and it serves none of them, fit under 2); 'far' (it does not fit in: with it added, the trip leaves it missing). When
   none holds: 'beaten' (with this many days, other places scored more). why: the reasons of its poor months (CLIMATE),
   each once. canAdd: Dodaj can put it on the trip (not when it needs a higher level, is closed or does not fit). drops:
   the places that would leave the trip if it were added (droppedPlaces); shorter: those that would stay with fewer nights
   (shortenedPlaces). added: Dodaj asked for it.
   Returns [{ id, reasons, why, canAdd, drops, shorter, added }]. settings: as in the link (Dodaj builds on them); st: their
   normSettings' result; route: planRoute's trip for them; data: planRoute's data; climate: CLIMATE. */
function whyOff(route, settings, st, data, climate) {
  var P = data.places, on = {}, seen = {}, months = [];
  route.stops.forEach(function (s) { on[s.id] = true; });
  st.months.forEach(function (m) { if (!seen[m]) { seen[m] = true; months.push(m + 1); } });
  return Object.keys(P).filter(function (id) { return !P[id].node && !on[id]; })
    .sort(function (a, b) { return P[a].axis - P[b].axis || (a < b ? -1 : 1); })
    .map(function (id) {
      var p = P[id], code = data.seasons[id], x = { id: id, reasons: [], why: [], canAdd: true, drops: [], shorter: [], added: st.add.indexOf(id) > -1 };
      function every(letter) { return months.every(function (m) { return code.charAt(m - 1) === letter; }); }
      if (st.remove.indexOf(id) > -1) x.reasons.push('removed');
      if (p.level > st.level) x.reasons.push('level');
      if (every('X')) x.reasons.push('closed');
      if (every('Z')) {
        x.reasons.push('season');
        months.forEach(function (m) { (climate[id].why[m] || []).forEach(function (w) { if (x.why.indexOf(w) < 0) x.why.push(w); }); });
      }
      if (st.interests.length && st.interests.every(function (k) { return (p.fit[k] || 0) < 2; })) x.reasons.push('profile');
      if (p.level > st.level || every('X')) { x.canAdd = false; return x; }
      var withIt = normSettings(withAdded(settings, id), P, data.hubs), r = withIt.ok ? planRoute(withIt, data) : null;
      // not fitted: closed in part of the term, or too far for these days
      var part = months.some(function (m) { return code.charAt(m - 1) === 'X'; });
      if (!r || !r.ok || r.missing.indexOf(id) > -1) { x.reasons.push(part ? 'closed_part' : 'far'); x.canAdd = false; }
      else { x.drops = droppedPlaces(route.stops, r.stops, P); x.shorter = shortenedPlaces(route.stops, r.stops, P); }
      if (!x.reasons.length) x.reasons.push('beaten');
      return x;
    });
}

/* What Dodaj changed besides the added place: left, the places on the old trip that the new one has not; came, the places
   on the new trip that the old one had not, the added place left out; each in the order of its trip (droppedPlaces:
   a night on the way is no place to report, a city twice on a round trip counts once). */
function addReport(before, after, added, places) {
  return { left: droppedPlaces(before, after, places),
    came: droppedPlaces(after, before, places).filter(function (id) { return id !== added; }) };
}

/* The swaps (SWAPS in content.js) set to „Samodzielnie” in the settings, as the other functions take them: places, the
   places whose days take their self versions (stopDays); roads, by the two places in alphabetical order, the road's self
   text and the item of its cost (segKey, tripBudget). moto: the settings' list of swap ids. */
function selfSwaps(moto, swaps) {
  var out = { places: {}, roads: {} };
  (moto || []).forEach(function (id) {
    var w = swaps[id];
    if (w && w.place) out.places[w.place] = true;
    if (w && w.roads) Object.keys(w.roads).forEach(function (pair) { out.roads[pair] = { text: w.roads[pair].text, cost: w.roads[pair].cost.self }; });
  });
  return out;
}
/* The roads of all swaps, by their two places in alphabetical order: { swap: its id, cost: { driver, self } }. */
function swapRoads(swaps) {
  var out = {};
  Object.keys(swaps).forEach(function (id) {
    Object.keys(swaps[id].roads || {}).forEach(function (pair) { out[pair] = { swap: id, cost: swaps[id].roads[pair].cost }; });
  });
  return out;
}
/* A copy of the settings with swap id set to „Samodzielnie” (self true) or back to the usual way with a driver. */
function withSwap(s, id, self) {
  var o = copySettings(s);
  o.moto = o.moto.filter(function (x) { return x !== id; });
  if (self) o.moto.push(id);
  return o;
}

/* Dodaj and Usuń on a copy of the settings: adding takes the place off the removed list, removing off the added one;
   withoutChanges clears both. */
function withAdded(s, id) {
  var o = copySettings(s);
  o.remove = o.remove.filter(function (x) { return x !== id; });
  if (o.add.indexOf(id) < 0) o.add.push(id);
  return o;
}
function withRemoved(s, id) {
  var o = copySettings(s);
  o.add = o.add.filter(function (x) { return x !== id; });
  if (o.remove.indexOf(id) < 0) o.remove.push(id);
  return o;
}
function withoutChanges(s) {
  var o = copySettings(s);
  o.add = [];
  o.remove = [];
  return o;
}

/* ---------- the budget ---------- */
/* A rough budget for a person, in euros, without the flights to Vietnam: { two, one, parts, items }. two is [from, to] for
   each of two people who share a room, a car, a boat and a guide; one for a person alone, who pays all of them. parts: the
   same split into nights, day (food, Grab, small tickets), travel (roads and domestic flights) and trips (the paid parts of
   the plans); items: the paid things of the trip, each key once with its cost over the whole trip, the domestic flights as
   'flights', dearest first (by to for two; a tie keeps the order of the trip). The rules:
   - a stay's nights cost the room of its place (a night on the way: its node's); an item with night: true (the cruise, the
     night at the rangers' station) has its own room, so its stay counts a night less;
   - each day of the trip costs day, and a person alone pays daySolo more;
   - a road segment costs from a seat in a van (shared) to a car with its driver (car) for its hours; the road of a swap
     (SWAPS: the Hải Vân pass) costs the item of the chosen way instead;
   - a flight costs flight.short up to shortFlightH hours in the air, else flight.long;
   - a plan's cost entry: an item costs pp + group / 2 for two, pp + group for one; a choice (a list) from its cheapest to its
     dearest, under the name of its first item.
   route: planRoute's trip; plans: stopDays of each stay; moto: the swaps set to „Samodzielnie”; data: { costs: COSTS,
   places: PLACES, swaps: SWAPS, shortFlightH: SHORT_FLIGHT_H }. */
// what an item of COSTS costs a person: pp + group / 2 for each of two, pp + group for one alone
function itemCost(it) { return { two: [it.pp[0] + it.group[0] / 2, it.pp[1] + it.group[1] / 2], one: [it.pp[0] + it.group[0], it.pp[1] + it.group[1]] }; }

function entryCost(e, items) {

function tripBudget(route, plans, moto, data) {

  ['nights', 'day', 'travel', 'trips'].forEach(function (k) { parts[k] = { two: [0, 0], one: [0, 0] }; });
  function add(part, c, key) {
    [0, 1].forEach(function (i) {

/* ---------- before the trip ---------- */

  var self = selfSwaps(moto, swaps), legs = route.stops.map(function (s) { return s.leg; }).concat([route.home]);

    legs.some(function (L) { return L.segs.some(function (g) { return g.mode === 'road' && !!self.roads[[g.from, g.to].sort().join('-')]; }); });

/* What to book ahead on this trip, the most urgent first (by ahead in BOOK; a tie keeps the order of the trip):

   tripBudget counts it (a long road from an airport: the car), or null when its cost is part of the stays or the travel
   (homestay, transfer); list: what it is about: the flights as [from, to] codes, the roads from airports as [code, place,
   rides] (each road once, rides 2 when the trip takes it both ways, and its cost counts every ride), the homestays as
   places; items: the items of COSTS booked under the key, each once, in the order of the trip. The keys: flights (any domestic flight);
   airport (a road of AIR_KEYS with book); transfer (a road between two places, but the road of a swap); homestay (a stay
   in a place of homestays); and the book key of each item of the plans and of a swap's road (item.book, or the item's own
   key). route, plans, moto: as for tripBudget; data: { costs, book, swaps, places, airports, airKeys, homestays,
   shortFlightH }. */

    if (!out[key]) { out[key] = { key: key, ahead: b.ahead, links: b.links, two: null, one: null, list: [], items: [] }; order.push(key); }
    return out[key];

  function cost(e, c) {
    if (!e) return;

    [0, 1].forEach(function (i) { e.two[i] += c.two[i]; e.one[i] += c.one[i]; });
  }
  // an item of COSTS booked under entry e: its cost, and its name once
  function item(e, k, c) {
    cost(e, c);

  }
  function leg(L) {
    cardSegs(L.segs, data.airports).forEach(function (g) {
      var e, k;
      if (g.mode === 'fly') {
        var f = g.h <= data.shortFlightH ? C.flight.short : C.flight.long;
        e = entry('flights');

        return;
      }

      if (code) {

        if (!air || !air.book) return;

        cost(e, { two: [C.car[0] * g.h / 2, C.car[1] * g.h / 2], one: [C.car[0] * g.h, C.car[1] * g.h] });
        var seen = e && e.list.filter(function (x) { return x[0] === code && x[1] === place; })[0];
        if (seen) seen[2]++;   // a road both ways: named once, with its rides
        else if (e) e.list.push([code, place, 1]);
      } else if (roadOf[pair]) {
        k = self.roads[pair] ? self.roads[pair].cost : roadOf[pair].cost.driver;

    (plans[i] || []).forEach(function (d) {

    .sort(function (a, b) { return b.e.ahead - a.e.ahead || a.i - b.i; }).map(function (x) { return x.e; });
}

var PACK_COLD_C = 15;   // a night this cold or colder (the mean low of a month, as the page rounds it) asks for a warm layer
/* What to pack for this trip, only what the trip asks for (decision of 15.10.2026): [{ code, places, t }] for the UI keys
   p.<code>, in this order: warm, the stays with a month whose nights are PACK_COLD_C °C or colder (t: the coldest); rain,
   the stays in a month of rain (rainyMonth); leeches, torch and swim, the stays whose plans or events met ask for them
   (pack, content.js), and swim also the stays by the sea (fit morze 2 or more); moto, when a swap ridden yourself is on the
   trip; then mosquito (dengue is in the whole country) on every trip. places: the places, each once, in the order of the

      if (w.t[0] > PACK_COLD_C) return;

    });
    for (var d = s.start; d < s.start + s.n; d++) if (rainyMonth(data.climate[s.id], st.months[d - 1] + 1)) put('rain', id);

    stayEvents(data.content[s.id], s, st).forEach(function (e) { (e.pack || []).forEach(function (k) { put(k, id); }); });

/* The text of a photo's licence on creativecommons.org, in the page's language (lang 'en', else Polish): 'CC BY-SA 4.0' →
   …/licenses/by-sa/4.0/deed.pl, a licence of a country ('CC BY-SA 3.0 de') with its country, CC0 → the CC0 deed; null for
   the public domain, which has no licence text (the photo's page on Commons says why). */

  var deed = 'deed.' + (lang === 'en' ? 'en' : 'pl');

  var m = /^CC (BY(?:-SA)?) (\d\.\d)(?: ([a-z]{2}))?$/.exec(license);
  return m ? 'https://creativecommons.org/licenses/' + m[1].toLowerCase() + '/' + m[2] + '/' + (m[3] ? m[3] + '/' : '') + deed : null;
}

/* An amount in euros, [from, to], in dong as the page writes it (decision of 15.10.2026): [from, to, millions], the two
   ends as text and whether they are millions. sum (the budget of a whole trip): whole millions, never under 1 ("17–39"); a
   part of it or a thing to pay for: millions with one decimal when the dearer end comes to 1 million or more ("0,8–1,5"),
   never under 0,1, else dong rounded to 10 000 ("260 000"), never under 10 000. rate: dong to a euro (EUR_VND). lang 'en'
   (stage 5): a decimal point and thousands with commas ("0.8–1.5", "260,000"). */

  var v = eur.map(function (x) { return x * rate; });
  if (sum) return v.map(function (x) { return String(Math.max(1, Math.round(x / 1e6))); }).concat([true]);
  if (Math.round(v[1] / 1e5) >= 10) {
    return v.map(function (x) { var t = (Math.max(1, Math.round(x / 1e5)) / 10).toFixed(1); return lang === 'en' ? t : t.replace('.', ','); }).concat([true]);
  }
  return v.map(function (x) { return money(Math.max(1, Math.round(x / 1e4)) * 1e4, lang); }).concat([false]);
}

/* An amount in euros as the page writes it in dong: { key, vars } for the UI keys vnd, vnd.one, mln, mln.one, vnd.upto and
   mln.upto, with the numbers of vndRange. A thing that may cost nothing (its from is 0, as the flight over Khau Phạ, which
   is up to the visitor) says only its dearer end, "do 2,2 mln VND", not a from rounded up to a price (the final review of
   plan B2, 15.10.2026); one number when both ends come out alike; "0 VND" only for what costs nothing. rate, sum and lang:
   as for vndRange. */

  var r = vndRange(eur, rate, sum, lang), m = r[2];

  return r[0] === r[1] ? { key: m ? 'mln.one' : 'vnd.one', vars: { a: r[0] } } : { key: m ? 'mln' : 'vnd', vars: { a: r[0], b: r[1] } };

/* A number with its thousands apart, as the language writes money: in Polish with no-break spaces, 260000 → '260 000'; in

/* ---------- travel texts ---------- */
/* The text of one road segment as [UI key, values]: from or to an airport; a road with a text of its own (roadKeys, by
   its two places in alphabetical order); Cát Bà with the ferry; Cát Tiên with the river crossing; the Mekong buses; else
   a limousine van or a car. The key is picked by the two places and the airport end, so every text reads right in both
   directions of travel (tests/content.test.js bans direction words); only the Mekong text names Phong Điền, so it has one
   form for going there and one for leaving. g: a segment of planRoute's legs; airports: AIRPORTS; selfRoads: the roads
   ridden yourself (selfSwaps(…).roads), whose own text wins; airKeys: AIR_KEYS, the long roads of an airport with a text
   of their own, which wins over the taxi. */

  var code = airports[g.from] ? g.from : airports[g.to] ? g.to : null, air = code && airKeys && airKeys[code + '-' + (code === g.from ? g.to : g.from)];
  if (air) return [air.text, {}];
  if (airports[g.from]) return ['r.taxi_from', { x: airports[g.from].name }];
  if (airports[g.to]) return ['r.taxi_to', { x: airports[g.to].name }];
  var pair = [g.from, g.to].sort().join('-');
  if (selfRoads && selfRoads[pair]) return [selfRoads[pair].text, {}];
  if (roadKeys[pair]) return [roadKeys[pair], {}];
  if (g.from === 'catba' || g.to === 'catba') return ['r.van_ferry', {}];
  if (g.from === 'cattien' || g.to === 'cattien') return ['r.car_cattien', {}];
  if (g.to === 'mekong') return ['r.bus_mekong', {}];
  if (g.from === 'mekong') return ['r.bus_mekong_from', {}];
  return ['r.van_car', {}];

/* The parts of a leg as the card and the list of what to book show them: a road that runs through an airport without a
   flight there (Ninh Bình to Hà Giang by Nội Bài) is one road from its first place to its last, its hours summed; the map
   draws every part (its line runs by the airport). segs: a leg's segments (legBetween); airports: AIRPORTS. */

  var out = [];

    else out.push(g);

  return out;
}

/* The ferries of a journey (FERRY in content.js): a road from an airport to a place behind a ferry, with the last crossing
   and the latest landing that makes it; a road from such a place to an airport, with the first crossing and the earliest
   time at the airport. Returns [{ key: 'n.ferry_in', place, last, land } or { key: 'n.ferry_out', place, first, at }].
   leg: a leg of planRoute; ferry: FERRY; airports: AIRPORTS. */

  var out = [];
  leg.segs.forEach(function (g) {
    if (g.mode !== 'road') return;
    if (airports[g.from] && ferry[g.to] && ferry[g.to].land[g.from]) out.push({ key: 'n.ferry_in', place: g.to, last: ferry[g.to].last, land: ferry[g.to].land[g.from] });
    if (airports[g.to] && ferry[g.from] && ferry[g.from].at[g.to]) out.push({ key: 'n.ferry_out', place: g.from, first: ferry[g.from].first, at: ferry[g.from].at[g.to] });
  });
  return out;
}

/* The flights of a journey that run only on some days of the week (FLIGHT_DAYS in content.js), as notes for its card:
   [{ key: 'n.flight_days', a, b, days }], a and b the airports in the order flown, days the UI key of the days.
   leg: a leg of planRoute (its segs); flightDays: FLIGHT_DAYS. */
function flightNotes(leg, flightDays) {
  return leg.segs.filter(function (g) { return g.mode === 'fly' && flightDays[[g.from, g.to].sort().join('-')]; })
    .map(function (g) { return { key: 'n.flight_days', a: g.from, b: g.to, days: flightDays[[g.from, g.to].sort().join('-')] }; });
}

var LONG_LEG_H = 7;   // a travel day this long or longer gets the "long day" flag and a note

/* The notes under a journey, as UI keys: an afternoon flight after two hours or more of road to the airport; a long day;
   after a one-night stay whose plan has a morning part (prevSolo), a warning that a long journey follows.
   prev: the stay before, { n }, or null on the arrival day. */

  var out = [];
  if (leg.flights && leg.segs[0].mode === 'road' && leg.segs[0].h >= 2) out.push('n.afternoon');
  if (leg.total >= LONG_LEG_H) out.push('n.long');
  if (prev && prev.n === 1 && prevSolo && leg.total >= 6) out.push('n.solo_long');
  return out;
}

/* ---------- Polish words ---------- */

function nightForm(n) {
  var last = n % 10, lastTwo = n % 100;

/* Polish typography: a one-letter word (a i o u w z) gets a no-break space after it, so no line ends on it. It must start the text
   or follow white space, ( „ or –. A run like "i w domu" needs several passes (a match uses up the space in front of the next word), so repeat.
   A number keeps its unit on the line (5 km, 5½ godz., 25 °C, 64 mm, 2–4 mln VND) and its thousands (17 000, 230 000 VND),
   and ≈ and „ok.” keep their number. A range of numbers
   (1–3, 140–260, 11:00–14:30) keeps together: a word joiner after its dash, which a browser would break after. */

  do {
    before = text;

  } while (text !== before);
  return text.replace(/≈ /g, '≈\u00a0').replace(/([\d½])–(?=[\d½])/g, '$1–\u2060').replace(/(^|[\s(„–])([Oo]k\.) (?=[\d½])/g, '$1$2\u00a0').replace(/([\d½]) (godz\.|min|km|mm|m|°C|mln|VND)(?![\p{L}])/gu, '$1\u00a0$2')
    .replace(/(\d) (?=\d{3}(?!\d))/g, '$1\u00a0').replace(/mln VND/g, 'mln\u00a0VND');
}
/* English typography (stage 5): as in Polish (tieShort), a number keeps its unit on the line (5 km, 4½ h, 25 °C, 2.2M VND,
   260,000 VND, 125 cc), ≈ keeps its number and a range of numbers (1–3, 11:00–14:30) keeps together; English has no
   one-letter words to tie. */
function tieEnglish(text) {
  return text.replace(/≈ /g, '≈\u00a0').replace(/([\d½])–(?=[\d½])/g, '$1–\u2060').replace(/([\d½]M?) (h|min|km|mm|m|°C|cc|VND)(?![\p{L}])/gu, '$1\u00a0$2');
}
/* "w marcu", "we wrześniu" (we before w and a consonant); in English (lang 'en') "in March". noun: the month as the UI key
   monl.<n> of the language gives it. */
function inMonthText(noun, lang) { return lang === 'en' ? 'in ' + noun : (/^w[^aeiouyąęó]/i.test(noun) ? 'we ' : 'w ') + noun; }

/* Multi-word names (Ba Bể, Hồ Chí Minh City) do not break across lines: wherever one stands in text, its spaces become
   no-break spaces. names: the names that have a space, longest first, so a longer name is tied before a shorter one in it. */
