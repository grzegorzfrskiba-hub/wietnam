<title>Wildlife of Vietnam · Route G</title>
<style>
/* __FONTS__ */
/* The wildlife subpage (stage 6): the colours, the fonts and the base rules of the page with the route (build.py copies its
   :root tokens here), then its own: a heading with the switch EN · PL, three tabs, cards, tiles and the field guide. */
/* __TOKENS__ */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.6; }
img { display: block; max-width: 100%; height: auto; }
a { color: var(--accent); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; font-family: var(--display); font-weight: 500; line-height: 1.1; text-wrap: balance; }
p, ul { margin: 0; }
ul { padding: 0; list-style: none; }
.wrap { max-width: 1200px; margin: 0 auto; padding-inline: var(--gutter); }
.btn-small { display: inline-flex; align-items: center; min-height: 44px; padding: 8px 14px; border-radius: 6px; background: var(--accent); color: var(--surface); font: 500 14px var(--body); text-decoration: none; }
.btn-small:hover { filter: brightness(1.08); }

/* heading and tabs */
.w-head { background: var(--surface); border-bottom: 1px solid var(--line); }
.w-head .wrap { position: relative; padding-block: 18px 0; }
.w-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 44px; }
.w-top a { display: inline-flex; align-items: center; min-height: 44px; font-size: 15px; }
.lang-switch { display: flex; align-items: center; font: 500 13px var(--mono); letter-spacing: 0.08em; color: var(--muted); }
.lang-switch button { min-width: 44px; min-height: 44px; padding: 0 8px; border: 0; background: none; color: inherit; font: inherit; letter-spacing: inherit; cursor: pointer; }
.lang-switch button[aria-pressed="true"] { color: var(--ink); text-decoration: underline 2px; text-underline-offset: 5px; }
.w-eyebrow { margin-top: 8px; font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.w-head h1 { font-size: clamp(34px, 6vw, 56px); margin-top: 4px; }
.w-lead { max-width: 62ch; margin-top: 10px; color: var(--muted); }
.w-tabs { display: flex; gap: 4px; margin-top: 18px; overflow-x: auto; }
.w-tabs a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-bottom: 3px solid transparent; color: var(--muted); font-weight: 500; text-decoration: none; white-space: nowrap; }
.w-tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
@media (max-width: 374px) { .w-tabs { gap: 0; } .w-tabs a { padding: 0 7px; } }

main { padding-block: 28px 48px; }
.w-intro h2 { font-size: clamp(26px, 4vw, 36px); }
.w-intro p { max-width: 70ch; margin-top: 8px; color: var(--muted); }
.w-tripbox { margin-top: 18px; padding: 12px 16px; border-radius: 8px; background: var(--accent-soft); }
.w-legend { margin-top: 14px; font-size: 14px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.w-group { margin-top: 34px; font-size: 24px; }
.w-group small { font: 500 14px var(--mono); color: var(--muted); }
.w-muted { color: var(--muted); }
.w-ok { color: var(--accent); font-weight: 500; }
.w-no { color: var(--wet); font-weight: 500; }
.w-kind { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12.5px; background: var(--accent-soft); color: var(--ink); }
.w-kind-rescue { background: var(--warm-soft); }
.w-kind-program { background: var(--cool-soft); }
.w-dots { font-family: var(--mono); letter-spacing: 1px; color: var(--accent); }
.w-iucn { display: inline-block; align-self: flex-start; margin-top: 6px; padding: 1px 8px; border-radius: 4px; font: 500 12px var(--mono); background: var(--line); }
.w-iucn-cr { background: var(--wet-soft); color: var(--wet); }
.w-iucn-en { background: var(--warm-soft); color: var(--warm); }

/* On your route: cards */
/* one card a row, its photo the column's width (19.10.2026: big photos, the map beside them) */
.w-cards { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; margin-top: 16px; }
.w-card { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.w-photo { display: block; width: 100%; padding: 0; border: 0; background: var(--photo-bg); cursor: zoom-in; }
.w-card-photo img { width: 100%; aspect-ratio: var(--ar, 3 / 2); object-fit: cover; object-position: var(--pos, 50% 50%); }
.w-nophoto { display: flex; align-items: center; justify-content: center; aspect-ratio: 3 / 2; padding: 16px; background: var(--land-o); color: var(--muted); text-align: center; font-size: 14px; }
.w-card-body { padding: 18px 22px 22px; display: flex; flex-direction: column; gap: 6px; }
.w-card h3 { font-size: clamp(26px, 4vw, 32px); }
.w-alt, .w-sci { font-size: 14px; color: var(--muted); }
.w-why { margin-top: 4px; }
.w-meets { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.w-meet { padding-top: 10px; border-top: 1px solid var(--line); font-size: 15px; }
.w-meet-top { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
/* an encounter's where and when, folded under its place: the arrow at the right turns when it opens */
.w-more > summary { display: flex; align-items: center; gap: 12px; min-height: 44px; list-style: none; cursor: pointer; }
.w-more > summary::-webkit-details-marker { display: none; }
.w-more > summary::after { content: ''; flex: none; margin: 0 6px 0 auto; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform .2s; }
.w-more[open] > summary::after { transform: rotate(-135deg); }
.w-more > p { margin-top: 4px; }
.w-chance { font-size: 14px; }
.w-addbox { margin-top: 10px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; font-size: 15px; }

/* Gallery: tiles */
.w-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(46%, 220px), 1fr)); gap: 14px; margin-top: 14px; }
.w-tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.w-tile-photo img, .w-tile .w-nophoto { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
.w-tile-name { display: flex; flex-direction: column; width: 100%; padding: 10px 12px 12px; border: 0; background: none; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
.w-tile-name i { font-size: 13px; color: var(--muted); }
.w-legend-tile { border-style: dashed; }

/* Field guide */
.w-place:focus, .w-card:focus { outline: none; }
.w-place { margin-top: 26px; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; scroll-margin-top: 16px; }
.w-place-h { display: flex; flex-direction: column; gap: 4px; }
.w-place h3 { font-size: 26px; }
.w-rows { margin-top: 12px; display: flex; flex-direction: column; }
/* a row: its thumbnail (96 px, 4:3; the photo viewer on a click), the name, how and when, the chance; on a phone the
   thumbnail on the left of the rest */
.w-row { display: grid; grid-template-columns: 96px minmax(0, 1.1fr) minmax(0, 2fr) auto; gap: 4px 16px; padding: 12px 0; border-top: 1px solid var(--line); font-size: 15px; }
.w-row.w-note { grid-template-columns: 1fr; color: var(--muted); }
.w-row-photo { width: 96px; border-radius: 6px; overflow: hidden; }
.w-row-photo img { width: 96px; aspect-ratio: 4 / 3; object-fit: cover; transition: transform .3s; }
.w-row-photo:hover img { transform: scale(1.06); }
@media (max-width: 640px) {
  .w-row { grid-template-columns: 80px minmax(0, 1fr); }
  .w-row > .w-row-photo { grid-row: 1 / span 3; width: 80px; }
  .w-row > .w-row-photo img { width: 80px; }
  .w-row > :not(.w-row-photo) { grid-column: 2; }
  .w-row.w-row-nopic { grid-template-columns: 1fr; }
  .w-row.w-row-nopic > .w-row-photo { display: none; }
  .w-row.w-row-nopic > :not(.w-row-photo) { grid-column: 1; }
}
.w-box { margin-top: 26px; padding: 16px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); }
.w-avoid { background: var(--wet-soft); border-color: transparent; }
.w-box h3 { font-size: 24px; }
.w-box ul { margin-top: 10px; padding-left: 20px; list-style: disc; display: flex; flex-direction: column; gap: 6px; }

/* The map beside the tabs (19.10.2026): the country with the trip, a dot at every place of the field guide in its colour, a
   ring for a place off the trip, and the points beyond Route G, grey and shown only while lit (wildapp.js). A lit place
   (class on) has its dot bigger, with a pulse around it, and its name; the other dots fade; the caption names the lit places.
   From 1101 px the map stands beside the tabs, sticky; below, a band over them: the map 180 px high on the left, the
   caption beside it. Its rules for the dots come from the map of the list of the places off the trip (template.html). */
.w-map { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 14px; margin: -8px 0 12px; padding: 6px 0;
  background: var(--paper); border-bottom: 1px solid var(--line); }
.w-map svg { display: block; height: 180px; width: auto; flex: none; overflow: visible; }
/* a place of the field guide or a card the page brings to the top (a link with #guide-<place>, a name in the guide) stands
   under the band, not behind it */
@media (max-width: 1100px) { .w-place, .w-card { scroll-margin-top: 210px; } }
.w-map-cap { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.w-map-names { display: flex; flex-direction: column; gap: 2px; font-weight: 600; font-size: 15px; line-height: 1.35; }
.w-map-names:empty { display: none; }
.w-map-name { display: flex; align-items: center; gap: 8px; animation: w-in .3s ease-out; }
.w-map-none { font-weight: 400; color: var(--muted); }
.w-map-key { font-size: 13px; color: var(--muted); }
.w-map .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
.w-map .dot.ring { background: var(--surface); box-shadow: inset 0 0 0 2px var(--c); }
@keyframes w-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (min-width: 1101px) {
  .w-main { display: grid; grid-template-columns: minmax(0, 780px) minmax(0, 1fr); gap: 40px; align-items: start; }
  .w-panels { grid-column: 1; grid-row: 1; }
  .w-map { grid-column: 2; grid-row: 1; top: 16px; display: block; margin: 0; padding: 0; background: none; border: 0; }
  .w-map svg { width: 100%; max-width: 340px; height: auto; max-height: calc(100vh - 150px); }
  .w-map-cap { margin-top: 10px; min-height: 48px; }
}
.bm-land { fill: var(--land); stroke: var(--border); stroke-width: 1; stroke-linejoin: round; }
.bm-road { stroke: var(--ink); stroke-width: 1.6; stroke-linecap: round; fill: none; opacity: 0.75; }
.bm-fly { stroke: var(--ink); stroke-width: 1.3; stroke-dasharray: 4 4; fill: none; opacity: 0.75; }
.bm-stay { fill: var(--ink); }
.bm-pt { cursor: pointer; }
.bm-pt .bm-dot { fill: var(--c); stroke: var(--surface); stroke-width: 2; transition: r .3s, opacity .3s; }
.bm-pt.ring .bm-dot { fill: var(--surface); stroke: var(--c); stroke-width: 3; }
.bm-pt .bm-halo { fill: var(--c); opacity: 0; }
.bm-hit { fill: transparent; }
.bm-pt.spot { pointer-events: none; }
.bm-pt.spot .bm-dot { opacity: 0; }
.bm-pt.spot.on .bm-dot { opacity: 1; }
/* the name: 14 px (BIG_NAME_PX in page.js), 14 px from the dot (BIG_NAME_GAP) */
.bm-pt text { font: 600 14px var(--body); fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; opacity: 0; transition: opacity .3s; pointer-events: none; }
.bm-pt.on .bm-dot { r: 9px; }
.bm-pt.on .bm-halo { animation: bm-pulse 1.6s ease-out infinite; }
.bm-pt.on text { opacity: 1; }
.w-map.any .bm-pt:not(.on) .bm-dot { opacity: 0.45; }
.w-map.any .bm-pt.spot:not(.on) .bm-dot { opacity: 0; }
@keyframes bm-pulse { 0% { r: 9px; opacity: 0.45; } 100% { r: 26px; opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .bm-pt.on .bm-halo { animation: none; r: 16px; opacity: 0.25; } .w-map-name { animation: none; } }
/* the band: the map drawn 180 px high, about 0.27 of its px, so its lines, dots and the place to tap one are drawn bigger
   in its px; the names stand beside the map */
@media (max-width: 1100px) {
  .bm-land { stroke-width: 3; }
  .bm-road { stroke-width: 5; }
  .bm-fly { stroke-width: 4.5; stroke-dasharray: 12 12; }
  .bm-stay { r: 8px; }
  .bm-pt .bm-dot { r: 15px; stroke-width: 5; }
  .bm-pt.ring .bm-dot { stroke-width: 8; }
  .bm-pt.on .bm-dot { r: 26px; }
  .bm-pt.on .bm-halo { animation-name: bm-pulse-band; }
  .bm-hit { r: 40px; }
  .bm-pt text { display: none; }
  @keyframes bm-pulse-band { 0% { r: 26px; opacity: 0.45; } 100% { r: 70px; opacity: 0; } }
}
@media (max-width: 1100px) and (prefers-reduced-motion: reduce) { .bm-pt.on .bm-halo { r: 44px; } }
/* the items a dot on the map frames: the cards, tiles and places of its place; those below the screen when a tab opens
   wait hidden (w-pre) and rise into place as they reach it (wildapp.js) */
.w-card, .w-tile, .w-place, .w-box { transition: opacity .5s ease-out, transform .5s ease-out, box-shadow .2s, border-color .2s; }
.w-pre { opacity: 0; transform: translateY(28px); }
.w-lit { border-color: var(--ink) !important; box-shadow: 0 0 0 1px var(--ink); }

/* the photo viewer */
.w-viewer { width: min(940px, 100vw - 24px); max-height: calc(100vh - 24px); padding: 0; border: 0; border-radius: 10px; background: var(--surface); color: var(--ink); }
.w-viewer::backdrop { background: rgba(var(--scrim), 0.82); }
.w-viewer img { width: 100%; max-height: 70vh; object-fit: contain; background: var(--photo-bg); }
.wv-text { padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 6px; }
.wv-text h2 { font-size: 26px; padding-right: 50px; }
.wv-sci, .wv-cap { font-size: 14px; color: var(--muted); }
.wv-close { position: absolute; top: 8px; right: 8px; min-width: 44px; min-height: 44px; border: 0; border-radius: 22px; background: var(--ctl-bg); color: var(--ctl-ink); font-size: 22px; cursor: pointer; }

footer { border-top: 1px solid var(--line); background: var(--surface); padding-block: 22px 32px; font-size: 14px; color: var(--muted); }
footer summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; color: var(--ink); }
footer ul { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
footer p { margin-top: 8px; }
.noscript { padding: 16px var(--gutter); }
@page { size: A4; margin: 12mm; }
@media print {
  .w-tabs, .lang-switch, #w-back, .w-addbox, .w-drops, .w-add, .w-viewer { display: none !important; }
  .w-pre { opacity: 1 !important; transform: none !important; }
  .w-more > summary::after { display: none; }
  /* on paper two cards a row, as before the big photos */
  .w-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
  /* the map once, before the open tab, with every place of the field guide named on it (wildapp.js lights them all) */
  .w-main { display: block; }
  .w-map { position: static; display: flex; align-items: flex-start; gap: 6mm; margin: 0 0 6mm; padding: 0; border: 0; background: none; break-inside: avoid; }
  .w-map svg { width: 70mm; max-width: none; height: auto; max-height: none; }
  .w-map-cap { margin: 0; }
  .w-map-names { display: none; }
  .bm-pt .bm-dot, .bm-pt.on .bm-dot { r: 6px; stroke-width: 2; }
  .bm-pt.ring .bm-dot { stroke-width: 3; }
  .bm-pt .bm-halo { display: none; }
  .bm-pt text { display: inline; }
  .bm-land { stroke-width: 1; }
  .bm-road { stroke-width: 1.6; }
  .bm-fly { stroke-width: 1.3; stroke-dasharray: 4 4; }
  .bm-stay { r: 3px; }
}
</style>
<noscript>__NOSCRIPT__</noscript>
<header class="w-head">
  <div class="wrap">
    <div class="w-top"><a id="w-back" href="../"></a>
      <div class="lang-switch" id="lang-switch" role="group" data-i18n-aria="lang.aria"><button type="button" data-lang="en" lang="en" aria-pressed="false">EN</button><span aria-hidden="true">·</span><button type="button" data-lang="pl" lang="pl" aria-pressed="false">PL</button></div>
    </div>
    <p class="w-eyebrow" data-i18n="w.eyebrow"></p>
    <h1 data-i18n="w.h1"></h1>
    <p class="w-lead" data-i18n="w.lead"></p>
    <nav class="w-tabs" data-i18n-aria="w.tabs.aria"><a id="tab-route" href="#route" data-i18n="w.tab.route"></a><a id="tab-gallery" href="#gallery" data-i18n="w.tab.gallery"></a><a id="tab-guide" href="#guide" data-i18n="w.tab.guide"></a></nav>
  </div>
</header>
<main class="wrap w-main">
  <div class="w-map" id="w-map" aria-hidden="true"></div>
  <div class="w-panels">
    <section id="p-route" hidden></section>
    <section id="p-gallery" hidden></section>
    <section id="p-guide" hidden></section>
  </div>
</main>
<footer>
  <div class="wrap">
    <details><summary id="w-credits-h"></summary><ul id="w-credits"></ul></details>
    <p data-i18n="w.credits.note"></p>
    <p data-i18n="ft.copy"></p>
  </div>
</footer>
<dialog class="w-viewer" id="w-viewer">
  <div id="wv-photo"></div>
  <div class="wv-text"><h2 id="wv-name"></h2><p class="wv-sci" id="wv-sci"></p><p id="wv-why"></p><p class="wv-cap" id="wv-cap"></p></div>
  <button type="button" class="wv-close" id="wv-close" data-i18n-aria="w.close">×</button>
</dialog>
<script>
